<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lions vs Panthers Promo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Layout: one cinematic 16:9 stage with a slim transport bar, dark by design (night game, stadium-screen look). */
:root{
  --ink:#05070a;
  --panel:#0c1118;
  --line:#1b2632;
  --fg:#eef3f6;
  --muted:#8c99a5;
  --gold:#ffc83d;
  --honolulu:#0076b6;
  --cyan:#10b7f0;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:18px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.eyebrow{margin:0;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.when{margin:0;color:var(--muted);font-size:20px;font-weight:500}
.stage{position:relative;width:100%;background:#000;border:1px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9}
.stage:fullscreen{display:grid;place-items:center;border:0}
.stage:fullscreen canvas{width:min(100vw,177.78vh)}
.big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 18px;border:2px solid var(--gold);background:rgba(5,7,10,.78);color:var(--fg);font:700 clamp(18px,3vw,28px)/1 var(--body);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.big[hidden]{display:none}
.big svg{width:clamp(30px,5vw,44px);height:auto;fill:var(--gold)}
.big:hover{background:var(--gold);color:var(--ink)}
.big:hover svg{fill:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.btn{font:700 17px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);padding:10px 16px;cursor:pointer;min-width:92px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.08);color:var(--ink)}
.btn:focus-visible,.big:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--gold);height:28px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:18px;min-width:84px;text-align:right}
.note{margin:0;color:var(--muted);font-size:15px;max-width:70ch}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <p class="eyebrow">Game night promo · 30 seconds</p>
    <h1>Lions vs Panthers</h1>
    <p class="when">Tonight · 8:00 PM · Anne's house</p>
  </header>

  <section class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="A 30 second animated ad for Lions versus Panthers tonight at 8 PM at Anne's house"></canvas>
    <button id="big" class="big" type="button" aria-label="Play the ad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg>
      <span>Play the ad</span>
    </button>
  </section>

  <div class="bar">
    <button id="pp" class="btn primary" type="button">Play</button>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="28.5" aria-label="Timeline">
    <span id="time" class="time">0:28 / 0:30</span>
    <button id="snd" class="btn" type="button" aria-pressed="true">Sound on</button>
    <button id="fs" class="btn" type="button">Fullscreen</button>
  </div>
  <p class="note">All artwork is original and uses team colors only. Not affiliated with or endorsed by the NFL or either club.</p>
</main>

<script>
(function(){
'use strict';
const W=1280,H=720,DUR=30,TR=.45;
const DISP='"Big Shoulders Display", Impact, "Arial Narrow", sans-serif';
const BODY='"Barlow Condensed", "Arial Narrow", sans-serif';
const C={ink:'#05070a',honolulu:'#0076B6',silver:'#B0B7BC',cyan:'#10B7F0',gold:'#FFC83D',white:'#F4F7F9',amber:'#FFB21E'};
const TAU=Math.PI*2;

/* ---------- math helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const ebounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d){x-=1.5/d;return n*x*x+.75}if(x<2.5/d){x-=2.25/d;return n*x*x+.9375}x-=2.625/d;return n*x*x+.984375};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- canvas ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let sc=1;

/* ---------- seeded scenery ---------- */
const R0=rng(11);
const dustP=Array.from({length:70},()=>({x:R0()*W,y:R0()*H,r:1+R0()*2.2,sp:12+R0()*30,dr:(R0()-.5)*20,ph:R0()*TAU}));
const starP=Array.from({length:110},()=>({x:R0()*W,y:R0()*H,r:1+R0()*2,tw:1+R0()*3,ph:R0()*TAU}));
const sparkP=Array.from({length:90},()=>({a:R0()*TAU,sp:260+R0()*620,life:.7+R0()*.9,sz:2+R0()*4,c:['#ffffff',C.gold,C.cyan,'#7cc8ff'][Math.floor(R0()*4)]}));
const confP=Array.from({length:90},()=>({x:R0()*W,y0:-R0()*H,sp:60+R0()*120,sw:R0()*TAU,sz:5+R0()*7,c:[C.gold,C.cyan,C.honolulu,'#ffffff',C.silver][Math.floor(R0()*5)]}));
const chips=Array.from({length:14},(_,i)=>({side:i%2?1:-1,idx:Math.floor(i/2),t0:21.35+i*.16}));

/* ---------- drawing helpers ---------- */
function bg(fill){ctx.fillStyle=fill;ctx.fillRect(-80,-80,W+160,H+160)}
function silverG(y,size){const g=ctx.createLinearGradient(0,y-size*.78,0,y);g.addColorStop(0,'#ffffff');g.addColorStop(.48,'#d3dae0');g.addColorStop(.52,'#8e99a2');g.addColorStop(1,'#e8edf0');return g}
function txt(s,x,y,size,fill,o){
  o=o||{};
  if(o.max){const mw=measure(s,size,o);if(mw>o.max)size=size*o.max/mw}
  ctx.save();
  ctx.font=(o.w||900)+' '+size+'px '+(o.f||DISP);
  ctx.textAlign=o.align||'center';ctx.textBaseline='alphabetic';
  ctx.globalAlpha*=(o.a==null?1:o.a);
  try{ctx.letterSpacing=(o.ls||0)+'px'}catch(e){}
  if(o.scale){ctx.translate(x,y);ctx.scale(o.scale,o.scale);x=0;y=0}
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb||30}
  if(o.stroke){ctx.lineWidth=o.sw||4;ctx.strokeStyle=o.stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill==='silver'?silverG(y,size):fill;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function measure(s,size,o){o=o||{};ctx.save();ctx.font=(o.w||900)+' '+size+'px '+(o.f||DISP);try{ctx.letterSpacing=(o.ls||0)+'px'}catch(e){}const w=ctx.measureText(s).width;ctx.restore();return w}
function typeLine(s,y,size,fill,t0,t1,t,o){
  o=o||{};
  const n=Math.floor(s.length*p(t,t0,t1));
  if(n<=0)return;
  const w=measure(s,size,o);
  txt(s.slice(0,n),640-w/2,y,size,fill,Object.assign({align:'left'},o));
  if(n<s.length&&Math.floor(t*8)%2===0){ctx.fillStyle=fill;ctx.fillRect(640-w/2+measure(s.slice(0,n),size,o)+6,y-size*.72,size*.07,size*.72)}
}
function dust(t,rgb){
  for(const d of dustP){
    const y=((d.y-t*d.sp)%H+H)%H,x=((d.x+Math.sin(t*.6+d.ph)*30+t*d.dr)%W+W)%W;
    ctx.fillStyle='rgba('+rgb+','+(.15+.25*Math.abs(Math.sin(t*1.3+d.ph)))+')';
    ctx.beginPath();ctx.arc(x,y,d.r,0,TAU);ctx.fill();
  }
}
function rays(t,col){
  ctx.save();
  for(let k=0;k<7;k++){
    const a=(-.55+k/6*1.1)+Math.sin(t*.5+k*1.3)*.05;
    const cx=640+Math.tan(a)*800;
    const g=ctx.createLinearGradient(640,-40,cx,760);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(640-14,-40);ctx.lineTo(640+14,-40);ctx.lineTo(cx+90,760);ctx.lineTo(cx-90,760);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function eyes(cx,cy,spread,sz,open,col,core,slit){
  if(open<=.01)return;
  for(const sgn of [-1,1]){
    ctx.save();
    ctx.translate(cx+sgn*spread,cy);ctx.rotate(-sgn*.2);
    const w=sz,h=sz*.42*open;
    ctx.shadowColor=col;ctx.shadowBlur=55;
    ctx.beginPath();ctx.moveTo(-w,0);ctx.quadraticCurveTo(0,-h*2.1,w,0);ctx.quadraticCurveTo(0,h*1.5,-w,0);ctx.closePath();
    const g=ctx.createRadialGradient(0,0,2,0,0,w);g.addColorStop(0,core);g.addColorStop(.55,col);g.addColorStop(1,'rgba(0,0,0,.92)');
    ctx.fillStyle=g;ctx.fill();
    ctx.shadowBlur=0;ctx.clip();
    ctx.fillStyle='#000';ctx.beginPath();
    if(slit)ctx.ellipse(0,0,w*.07,h*2.4,0,0,TAU);else ctx.ellipse(0,0,w*.2,h*1.5,0,0,TAU);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(-w*.2,-h*.4,w*.045,0,TAU);ctx.fill();
    ctx.restore();
  }
}
function slash(x1,y1,x2,y2,pr,wid,col,a){
  if(pr<=0)return;
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,n=26,A=[],B=[];
  for(let i=0;i<=n;i++){
    const f=i/n*pr,w=wid*Math.pow(Math.sin(Math.PI*clamp(f)),.7);
    const px=x1+dx*f,py=y1+dy*f;
    A.push([px+nx*w,py+ny*w]);B.push([px-nx*w,py-ny*w]);
  }
  ctx.save();ctx.globalAlpha*=(a==null?1:a);ctx.shadowColor=col;ctx.shadowBlur=26;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(A[0][0],A[0][1]);
  for(const q of A)ctx.lineTo(q[0],q[1]);
  for(let i=B.length-1;i>=0;i--)ctx.lineTo(B[i][0],B[i][1]);
  ctx.closePath();ctx.fill();ctx.restore();
}
function rings(t,t0,x,y,col,max,n){
  for(let k=0;k<(n||2);k++){
    const d=t-t0-k*.12;
    if(d>0&&d<.9){ctx.strokeStyle=col;ctx.globalAlpha=.65*(1-d/.9);ctx.lineWidth=6*(1-d/.9)+1;ctx.beginPath();ctx.arc(x,y,eo(d/.9)*max,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  }
}
function flash(t,t0,len,a){const d=t-t0;if(d>=0&&d<len){ctx.fillStyle='rgba(255,255,255,'+(a*(1-d/len))+')';ctx.fillRect(-80,-80,W+160,H+160)}}
function chipDisc(x,y,body,ring){
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+9,40,12,0,0,TAU);ctx.fill();
  ctx.fillStyle=body;ctx.fillRect(x-40,y-2,80,10);
  ctx.beginPath();ctx.ellipse(x,y+8,40,12,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-40,y-2,80,10);
  ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(x,y-2,40,12,0,0,TAU);ctx.fill();
  ctx.strokeStyle=ring;ctx.lineWidth=3;ctx.setLineDash([9,7]);ctx.beginPath();ctx.ellipse(x,y-2,31,8.5,0,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=ring;ctx.beginPath();ctx.ellipse(x,y-2,10,3.2,0,0,TAU);ctx.fill();
}
function bug(t,a){
  ctx.save();ctx.globalAlpha*=a;
  ctx.fillStyle='rgba(5,7,10,.72)';ctx.fillRect(1030,40,214,44);
  ctx.fillStyle=C.gold;ctx.fillRect(1030,40,6,44);
  txt('TONIGHT · 8 PM',1050,73,30,C.white,{max:180,align:'left',w:700,f:BODY,ls:3});
  ctx.restore();
}

/* ---------- scenes ---------- */
function s1(t){
  bg(C.ink);
  for(const th of [.35,.75,1.5,1.9,2.55]){
    const d=t-th;
    if(d>0&&d<1.3){ctx.strokeStyle='rgba(16,183,240,'+(.5*(1-d/1.3))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(640,360,d*520,0,TAU);ctx.stroke()}
  }
  txt('A BET TRACKER PRESENTATION',640,86,26,C.silver,{w:600,f:BODY,ls:12,a:.7*p(t,.1,.7)});
  ctx.save();ctx.globalAlpha=1-p(t,2.7,3);
  typeLine('TWO TEAMS.',360,150,C.white,.3,1.2,t);
  typeLine('ONE NIGHT.',520,150,C.gold,1.5,2.35,t);
  if(t>2.3&&t<2.46){
    const w=measure('ONE NIGHT.',150);
    txt('ONE NIGHT.',640-w/2-9,520,150,'rgba(255,40,80,.6)',{align:'left'});
    txt('ONE NIGHT.',640-w/2+9,520,150,'rgba(16,183,240,.6)',{align:'left'});
  }
  ctx.restore();
}
function s2(t){
  const g=ctx.createRadialGradient(640,320,40,640,320,820);g.addColorStop(0,'#0c4f80');g.addColorStop(.5,'#06233f');g.addColorStop(1,'#020812');bg(g);
  rays(t,'rgba(130,205,255,.08)');
  dust(t,'255,210,120');
  eyes(640,205,150,78,eo(p(t,3.3,4.2)),C.amber,'#fff2c0',false);
  const sa=1-.65*p(t,5.2,6);
  for(let i=-1;i<=1;i++){
    const s0=4.2+(i+1)*.06;
    slash(230-32*i,100+51*i,1030-32*i,600+51*i,eo(p(t,s0,s0+.38)),20,'#bfe6ff',sa);
  }
  rings(t,4.5,640,430,'#8fd0ff',700,3);
  const pr=p(t,4.5,4.95);
  if(pr>0){
    const sc2=lerp(1.5,1,eob(pr));
    ctx.save();ctx.globalAlpha=pr;
    txt('LIONS',648,488,250,C.honolulu,{scale:sc2,ls:6,max:760});
    txt('LIONS',640,480,250,'silver',{max:760,scale:sc2,glow:'#3aa8f0',gb:40,ls:6});
    ctx.restore();
  }
  txt('DETROIT',640,556,54,'#74c0f0',{f:BODY,w:700,ls:26,a:p(t,5.1,5.5)});
  flash(t,4.5,.5,.75);
}
function s3(t){
  bg('#020406');
  for(let k=0;k<3;k++){
    const x=((k*560+t*(18+k*7))%1800)-260,y=500+k*50;
    ctx.save();ctx.translate(x,y);ctx.scale(2.6,.5);
    const g=ctx.createRadialGradient(0,0,0,0,0,260);g.addColorStop(0,'rgba(16,183,240,.2)');g.addColorStop(1,'rgba(16,183,240,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,260,0,TAU);ctx.fill();ctx.restore();
  }
  const g2=ctx.createRadialGradient(640,200,20,640,260,620);g2.addColorStop(0,'rgba(0,70,110,.45)');g2.addColorStop(1,'rgba(0,0,0,0)');bg(g2);
  dust(t,'120,210,255');
  const drift=Math.sin(t*1.7)*10*p(t,8.1,8.6);
  eyes(640+drift,205,150,78,eo(p(t,7.3,8.2)),C.cyan,'#d6f6ff',true);
  const sa=1-.65*p(t,9.2,10);
  for(let i=-1;i<=1;i++){
    const s0=8.35+(i+1)*.06;
    slash(1050+32*i,100-51*i,250+32*i,600-51*i,eo(p(t,s0,s0+.38)),20,'#7fdcff',sa);
  }
  const sp=p(t,8.5,8.95),x=lerp(1560,640,eo(sp));
  if(sp>0){
    if(sp<1)for(let k=4;k>=1;k--)txt('PANTHERS',x+k*46,480,210,'rgba(16,183,240,'+(.12*(5-k))+')',{ls:4});
    txt('PANTHERS',x,480,210,'#eaf7fc',{max:1100,stroke:C.cyan,sw:3,glow:C.cyan,gb:36,ls:4});
  }
  txt('CAROLINA',640,556,54,C.cyan,{f:BODY,w:700,ls:26,a:p(t,9.1,9.5)});
  rings(t,8.55,640,430,'#7fdcff',700,3);
  flash(t,8.55,.45,.6);
}
function s4(t){
  const Ti=11.6,sl=eo(p(t,11,Ti)),offL=-(W*.62)*(1-sl),offR=(W*.62)*(1-sl);
  bg(C.ink);
  ctx.save();ctx.translate(0,0);
  const zoom=1+.05*p(t,Ti,16);ctx.translate(640,360);ctx.scale(zoom,zoom);ctx.translate(-640,-360);
  // left
  ctx.save();ctx.translate(offL,0);
  const gl=ctx.createLinearGradient(0,0,700,720);gl.addColorStop(0,'#0a86cf');gl.addColorStop(1,'#012a47');
  ctx.fillStyle=gl;ctx.beginPath();ctx.moveTo(-200,-20);ctx.lineTo(700,-20);ctx.lineTo(580,740);ctx.lineTo(-200,740);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.1;ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){ctx.fillRect(40+i*70,-20,18,760)}
  ctx.globalAlpha=1;ctx.restore();
  // right
  ctx.save();ctx.translate(offR,0);
  const gr=ctx.createLinearGradient(1280,0,640,720);gr.addColorStop(0,'#04070a');gr.addColorStop(1,'#07202e');
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(700,-20);ctx.lineTo(1480,-20);ctx.lineTo(1480,740);ctx.lineTo(580,740);ctx.closePath();ctx.fill();
  const gc=ctx.createRadialGradient(640,360,10,640,360,420);gc.addColorStop(0,'rgba(16,183,240,.35)');gc.addColorStop(1,'rgba(16,183,240,0)');ctx.fillStyle=gc;ctx.fillRect(500,0,800,720);
  ctx.restore();
  // names
  const nl=p(t,Ti+.1,Ti+.45);
  txt('LIONS',270+offL,400,130,'silver',{a:nl,ls:4,glow:'#3aa8f0',gb:24,max:420});
  txt('DETROIT',270+offL,448,38,'#bfe6ff',{f:BODY,w:700,ls:18,a:nl});
  txt('PANTHERS',1005+offR,400,130,'#eaf7fc',{max:450,a:nl,ls:3,stroke:C.cyan,sw:2,glow:C.cyan,gb:24});
  txt('CAROLINA',1005+offR,448,38,C.cyan,{f:BODY,w:700,ls:18,a:nl});
  // lightning
  const la=(t>Ti)?1-p(t,12.6,13.3):0;
  if(la>0){
    const r=rng(Math.floor(t*18)+3);const pts=[];
    for(let i=0;i<=14;i++){const f=i/14;pts.push([700-120*f+(i%14===0?0:(r()-.5)*54),f*720])}
    for(const [lw,col,gb] of [[9,C.cyan,30],[3.5,'#ffffff',10]]){
      ctx.save();ctx.globalAlpha=la;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.shadowColor=C.cyan;ctx.shadowBlur=gb;ctx.lineJoin='round';
      ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore();
    }
  }
  // sparks
  const sd=t-Ti;
  if(sd>0)for(const s of sparkP){
    if(sd<s.life){
      const x=640+Math.cos(s.a)*s.sp*sd,y=360+Math.sin(s.a)*s.sp*sd+520*sd*sd;
      ctx.globalAlpha=1-sd/s.life;ctx.fillStyle=s.c;ctx.fillRect(x,y,s.sz,s.sz);ctx.globalAlpha=1;
    }
  }
  rings(t,Ti,640,360,'#ffffff',620,3);
  // VS
  const vp=p(t,11.85,12.35);
  if(vp>0)txt('VS',640,438,150,C.gold,{scale:lerp(2.2,1,eob(vp)),a:clamp(vp*3),stroke:'#3a2a00',sw:6,glow:'#ff9a1f',gb:46});
  ctx.restore();
  flash(t,Ti,.55,.9);

  if(playing)raf=requestAnimationFrame(tick);
}
function play(){
  audioInit();
  if(t>=DUR-.01||!started){t=0;seekCues(-1)}
  started=true;playing=true;last=performance.now();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);ui();
}
function pause(){playing=false;cancelAnimationFrame(raf);ui()}
pp.addEventListener('click',()=>playing?pause():play());
big.addEventListener('click',play);
seek.addEventListener('input',()=>{t=parseFloat(seek.value);started=true;seekCues(t);render(t);ui()});
snd.addEventListener('click',()=>{soundOn=!soundOn;snd.textContent=soundOn?'Sound on':'Sound off';snd.setAttribute('aria-pressed',String(soundOn))});
fs.addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else if(stage.requestFullscreen)stage.requestFullscreen().catch(()=>{})}catch(e){}});
function fit(){
  const r=stage.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(320,Math.round(cv.getBoundingClientRect().width||r.width));
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr);sc=cv.width/W;render(t);
}
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);else window.addEventListener('resize',fit);
fit();ui();
const ready=()=>{render(t)};
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('900 100px "Big Shoulders Display"'),document.fonts.load('600 40px "Barlow Condensed"'),document.fonts.load('700 40px "Barlow Condensed"')]).then(ready,ready);
  document.fonts.ready.then(ready);
}
window.__seek=function(x){t=x;started=true;seekCues(x);render(x);ui()};
})();
</script>
