<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bet Room</title>
<!-- Home-screen icon and name, so an iPhone shortcut shows Bet Room rather
     than the jp4mayor icon from the root of the site. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Bet Room">
<meta name="theme-color" content="#0E1A16">
<link rel="stylesheet" href="styles.css">
<!-- The database library, from our own copy so it never changes underneath
     us. Until that copy is in js/vendor/, fall back to the public CDN. -->
<script src="js/vendor/supabase.js"></script>
<script>
  window.supabase || document.write(
    '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');
</script>
</head>
<body>
  <div class="dot" id="live" title="realtime connection"></div>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
