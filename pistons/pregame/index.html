<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pistons Pregame</title>
<meta name="description" content="Detroit Pistons game preview: matchup, injuries, player projections and talking points.">
<meta name="theme-color" content="#1D428A">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pregame">
<style>
[hidden]:not([hidden=until-found i]){display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<meta name="theme-color" content="#1D428A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column, same family as Pistons Postgame. A matchup band with the tip countdown up top, then the preview in reading order, archive last. */
:root{
  --bg:#FFFFFF; --surface:#F3F6FB; --card:#FFFFFF; --ink:#0F1F3D; --muted:#5A6680; --line:#DCE2EC;
  --blue:#1D428A; --red:#C8102E; --kick:#C8102E; --link:#1D428A;
  --win:#1D7A46; --loss:#C8102E; --warn:#A35F00; --tint:rgba(29,66,138,.07); --num:#1D428A;
  --s-det:#2a78d6; --s-opp:#eb6834; --c-muted:#6b7590; --c-ink2:#45506a; --c-grid:#e8ecf3; --c-axis:#c5cddb; --c-tip:#0F1F3D; --c-tip-ink:#FFFFFF;
  --band:#1D428A; --band-ink:#FFFFFF; --band-muted:#C9D5EE; --band-line:rgba(255,255,255,.18);
  --focus:#C8102E;
  --f-disp:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730; --surface:#0E1B36; --card:#12234A; --ink:#F2F5FB; --muted:#A7B3CD; --line:#223660;
    --kick:#F0506A; --link:#9DBBF7; --win:#4CC38A; --loss:#F0506A; --warn:#F2B04A; --tint:rgba(91,141,239,.10); --num:#F2F5FB;
    --s-det:#3987e5; --s-opp:#d95926; --c-muted:#8f9bb8; --c-ink2:#c3cbe0; --c-grid:#1c2f58; --c-axis:#2f4677; --c-tip:#F2F5FB; --c-tip-ink:#0B1730;
    --band:#12234A; --band-ink:#FFFFFF; --band-muted:#A7B3CD; --band-line:rgba(255,255,255,.14);
    --focus:#F0506A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730; --surface:#0E1B36; --card:#12234A; --ink:#F2F5FB; --muted:#A7B3CD; --line:#223660;
  --kick:#F0506A; --link:#9DBBF7; --win:#4CC38A; --loss:#F0506A; --warn:#F2B04A; --tint:rgba(91,141,239,.10); --num:#F2F5FB;
  --s-det:#3987e5; --s-opp:#d95926; --c-muted:#8f9bb8; --c-ink2:#c3cbe0; --c-grid:#1c2f58; --c-axis:#2f4677; --c-tip:#F2F5FB; --c-tip-ink:#0B1730;
  --band:#12234A; --band-ink:#FFFFFF; --band-muted:#A7B3CD; --band-line:rgba(255,255,255,.14);
  --focus:#F0506A; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.eyebrow{font:700 12px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--kick)}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 5px #fff;flex:none}
.mark span{font:800 11px/1 var(--f-disp);color:#fff}
.brand b{font:800 20px/1 var(--f-disp);letter-spacing:.02em}
.updated{font-size:12px;color:var(--muted);text-align:right}

/* matchup band */
.band{background:var(--band);color:var(--band-ink);border-radius:14px;overflow:hidden;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--red)}
.band-in{padding:18px 18px 22px;display:grid;gap:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font:600 13px/1.2 var(--f-body);color:var(--band-muted);letter-spacing:.02em;align-items:center}
.pill{font:800 12px/1 var(--f-disp);letter-spacing:.1em;padding:5px 8px 4px;border-radius:4px;background:var(--red);color:#fff;text-transform:uppercase}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:grid;gap:4px;min-width:0}
.side.r{text-align:right}
.side .nm{font:800 clamp(30px,9vw,50px)/.95 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.side .rec{font:700 15px/1 var(--f-disp);letter-spacing:.08em;color:var(--band-muted)}
.side .st{font-size:13px;color:var(--band-muted)}
.at{font:700 14px/1 var(--f-disp);color:var(--band-muted);letter-spacing:.1em}
.tip{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;border-top:1px solid var(--band-line);padding-top:14px}
.tip .clock{font:800 clamp(34px,10vw,52px)/.9 var(--f-disp);letter-spacing:.01em}
.tip .lbl{font:700 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--band-muted);text-transform:uppercase}
.tip .when{text-align:right;font:600 14px/1.35 var(--f-body);color:var(--band-muted)}
.tip .when b{color:var(--band-ink);font-weight:700}

.head{display:grid;gap:8px;padding-block:22px 4px}
.head h1{font-size:clamp(28px,7vw,40px);line-height:1.02;font-weight:800}
.head p{margin:0;color:var(--muted);font-size:17px}

section.blk{padding-block:22px 4px;display:grid;gap:12px}
section.blk>h2{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section.blk>h2 .eyebrow{font-size:11px}

/* keys */
.keys{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:k}
.keys li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);counter-increment:k}
.keys li::before{content:counter(k);font:800 26px/1 var(--f-disp);color:var(--kick);text-align:center;padding-top:2px}
.keys b{display:block;font:700 18px/1.2 var(--f-disp);letter-spacing:.02em}
.keys span{font-size:15px;color:var(--muted)}
.keys li>div{min-width:0}

/* who to watch */
.leaders{display:grid;gap:8px}
.ld{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ld .tm{font:800 13px/1 var(--f-disp);letter-spacing:.06em;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--blue);color:#fff}
.ld .tm.opp{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.ld .who{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ld .badge{font:700 11px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--kick);border:1px solid currentColor;border-radius:4px;padding:3px 5px 2px}
.ld .stat{font:700 17px/1.2 var(--f-disp);letter-spacing:.03em;margin-top:2px}
.ld .sub{font-size:14px;color:var(--muted)}
.ld>div{min-width:0}

/* injuries */
.inj{display:grid;gap:14px}
@media (min-width:600px){.inj{grid-template-columns:1fr 1fr}}
.inj h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.inj ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.inj li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.inj li .d{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.chip{font:700 11px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px 3px;border-radius:4px;border:1px solid currentColor;align-self:center;white-space:nowrap}
.chip.out{color:var(--loss)}
.chip.q{color:var(--warn)}
.chip.ok{color:var(--win)}
.inj .none{padding:9px 0;color:var(--muted);border-bottom:1px solid var(--line)}

/* form */
.form{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.frow .ab{font:800 16px/1 var(--f-disp);letter-spacing:.06em}
.games{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.g{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;display:grid;gap:2px;background:var(--card);min-width:0}
.g i{font:800 15px/1 var(--f-disp);font-style:normal;color:var(--win)}
.g i.L{color:var(--loss)}
.g span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g b{font:600 12px/1.1 var(--f-body);white-space:nowrap;letter-spacing:-.02em}

/* tale of the tape */
.chart{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;display:grid;gap:8px;min-width:0}
.chart .sub{font-size:14px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:var(--f-body);font-size:12px;fill:var(--c-muted);font-variant-numeric:tabular-nums}
.chart svg text.lbl{fill:var(--ink);font-weight:600}
.chart svg text.val{fill:var(--c-ink2);font-weight:600}
.chart svg text.strong{fill:var(--ink);font-weight:700}
.chart svg .base{stroke:var(--c-axis);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--c-ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* player table */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font:700 15px/1 var(--f-disp);letter-spacing:.06em;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ptbl{overflow-x:auto}
.ptbl table{width:100%;border-collapse:collapse;font-size:14.5px}
.ptbl th,.ptbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ptbl th:first-child,.ptbl td:first-child{text-align:left}
.ptbl th{font:700 12px/1 var(--f-disp);letter-spacing:.12em;color:var(--muted)}
.ptbl td.p{font-weight:700}
.ptbl td small{color:var(--muted);font-size:12px;margin-left:4px}
.note{font-size:13.5px;color:var(--muted)}

/* projections */
.proj{overflow-x:auto}
.proj table{width:100%;border-collapse:collapse;font-size:15px}
.proj th,.proj td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.proj th:first-child,.proj td:first-child{text-align:left}
.proj th{font:700 12px/1 var(--f-disp);letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.proj td b{font:700 17px/1.1 var(--f-disp);letter-spacing:.02em;display:block}
.proj td small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.proj td.nm{min-width:112px}
.proj td.nm span{font-weight:700}
.proj td.nm small{white-space:normal;max-width:28ch}
.proj td.mn{color:var(--muted);font-weight:600}
.howto{font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.howto summary{cursor:pointer;font-weight:600;width:max-content}
.caveat{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--tint)}

/* over/under his average */
.ou{display:grid;gap:8px}
.oc{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px;display:grid;gap:6px}
.oc .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.oc .who{font-weight:700}
.oc .dir{font:800 20px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.oc .dir.over{color:var(--win)}
.oc .dir.under{color:var(--kick)}
.oc .odds{font-size:14px;color:var(--muted)}
.oc .odds b{color:var(--ink)}
.oc ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--c-ink2);display:grid;gap:2px}

/* talking points */
.tp{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tp li{padding:12px 14px;background:var(--tint);border-radius:10px;font-size:16.5px}

/* the call */
.call{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--card)}
.call .pk{font:800 26px/1 var(--f-disp);letter-spacing:.02em}
.call p{margin:0;color:var(--muted)}

.facts{display:grid;gap:0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.facts b{font:700 13px/1.4 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:460px){.facts div{grid-template-columns:1fr;gap:2px}}

/* share */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{border-color:var(--muted)}
.sharetext{font-size:15px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;margin:0;user-select:all}
.toast{font-size:14px;color:var(--win);font-weight:600;min-height:1.2em}
.sources{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:18px}

/* archive */
.arch{display:grid;gap:6px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.arow[aria-current="true"]{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.arow .d{font:700 13px/1.1 var(--f-disp);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;width:52px}
.arow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .s{font:700 14px/1 var(--f-disp);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out both}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true"><span>DET</span></div><b>Pistons Pregame</b></div>
    <div class="updated" id="updated"></div>
  </header>
  <main id="app"><div class="empty">No previews yet. Before the next game, ask Claude for the pregame.</div></main>
  <section class="blk" aria-labelledby="arch-h">
    <h2 id="arch-h">All previews</h2>
    <div class="arch" id="arch"></div>
  </section>
  <footer class="foot">
    <span>After the game: <a href="../recaps/">Pistons Postgame</a> · <a href="../">Pistons Season Hub</a></span>
    <span>Stats from ESPN. Unofficial fan page, not affiliated with the Detroit Pistons or the NBA.</span>
  </footer>
</div>

<script src="data/pregame.js"></script>
<script src="data/matchup.js"></script>
<script>
(function(){
  var DATA=window.PISTONS_PREGAME||{games:[]}, MU=window.PISTONS_MATCHUPS||{};
  var games=(DATA.games||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  var app=document.getElementById("app"), current=null, timer=null;
  var DET="var(--s-det)", OPP="var(--s-opp)";

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function dt(iso,opt){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-US",opt)}
  function f1(v){return Math.round(v*10)/10}
  function T(x,y,s,cls,anchor){return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(cls?' class="'+cls+'"':'')+(anchor?' text-anchor="'+anchor+'"':'')+'>'+esc(s)+'</text>'}
  function find(id){for(var i=0;i<games.length;i++)if(games[i].id===id)return games[i];return null}

  if(DATA.updated){
    var u=new Date(DATA.updated);
    document.getElementById("updated").textContent="Updated "+u.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  }

  function countdown(tip){
    var ms=tip-Date.now();
    if(ms<=0) return ms>-3*3600e3?["Tipped off","Game on"]:["Final","Check the postgame"];
    var m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
    return [d?d+"d "+h+"h":h?h+"h "+(mm<10?"0":"")+mm+"m":mm+"m","Until tip"];
  }
  function tickClock(tip){
    var c=document.getElementById("clock"),l=document.getElementById("clocklbl");if(!c)return;
    var v=countdown(tip);c.textContent=v[0];l.textContent=v[1];
  }

  function injChip(st){
    var s=String(st||"").toLowerCase();
    var cls=/out/.test(s)?"out":/day|question|doubt|probable|gtd/.test(s)?"q":"ok";
    return '<span class="chip '+cls+'">'+esc(st)+'</span>';
  }
  function injList(abbr,list){
    var h='<div><h3>'+esc(abbr)+'</h3><ul>';
    if(!list||!list.length) h+='<li class="none">Nothing listed</li>';
    (list||[]).forEach(function(i){
      var d=[i.type,i.detail,i.side].filter(Boolean).join(", ");
      var ret=i.returnDate?"Est. return "+dt(i.returnDate,{month:"short",day:"numeric"}):"";
      h+='<li><span>'+esc(i.name)+(i.pos?' <span class="muted">'+esc(i.pos)+'</span>':'')+'</span>'+injChip(i.status)+((d||ret)?'<span class="d">'+esc([d,ret].filter(Boolean).join(" · "))+'</span>':'')+'</li>';
    });
    return h+'</ul></div>';
  }

  function formRow(abbr,list){
    var rows=(list||[]).slice().sort(function(a,b){return a.date<b.date?-1:1});
    return '<div class="frow"><span class="ab">'+esc(abbr)+'</span><div class="games">'+rows.map(function(g){
      return '<div class="g" title="'+esc(g.date)+'"><i class="'+(g.result==="W"?"":"L")+'">'+esc(g.result)+'</i><b>'+esc(g.score)+'</b><span>'+esc(g.at==="@"?"@ ":"vs ")+esc(g.opp)+'</span></div>';
    }).join("")+'</div></div>';
  }

  /* tale of the tape: mirrored bars, each row scaled to its own max so mixed units stay readable */
  function tape(el,m){
    var a=m.stats.det,b=m.stats.opp;
    var rows=[["Points per game",a.ppg,b.ppg,"",1],["Field goal %",a.fgPct,b.fgPct,"%",1],["3-point %",a.tpPct,b.tpPct,"%",1],["3s made per game",a.tpm,b.tpm,"",1],
      ["Rebounds",a.reb,b.reb,"",1],["Offensive rebounds",a.oreb,b.oreb,"",1],["Assists",a.ast,b.ast,"",1],["Steals",a.stl,b.stl,"",1],["Blocks",a.blk,b.blk,"",1],["Turnovers",a.to,b.to,"",0]];
    var W=el.clientWidth||340,rh=38,H=rows.length*rh+4,cx=W/2,half=cx-48,s="";
    rows.forEach(function(r,i){
      var y0=i*rh,mx=Math.max(r[1],r[2],0.0001),ld=r[1]/mx*half,lo=r[2]/mx*half;
      var better=r[4]?(r[1]>r[2]?0:r[2]>r[1]?1:-1):(r[1]<r[2]?0:r[2]<r[1]?1:-1);
      s+=T(cx,y0+13,r[0],"lbl","middle");
      s+='<rect x="'+f1(cx-1-ld)+'" y="'+(y0+19)+'" width="'+f1(ld)+'" height="11" rx="3" style="fill:'+DET+'"/>';
      s+='<rect x="'+f1(cx+1)+'" y="'+(y0+19)+'" width="'+f1(lo)+'" height="11" rx="3" style="fill:'+OPP+'"/>';
      s+=T(cx-1-ld-6,y0+29,r[1]+r[3],better===0?"strong":"val","end")+T(cx+1+lo+6,y0+29,r[2]+r[3],better===1?"strong":"val","start");
    });
    el.innerHTML='<svg viewBox="0 0 '+f1(W)+' '+H+'" width="'+f1(W)+'" height="'+H+'" role="img" aria-label="Team season averages compared">'+s+'</svg>';
  }

  function playerTable(m,side){
    var cols=(m.playerCols||"").split(","),list=(m.players&&m.players[side])||[];
    if(!list.length) return '<p class="note">No player averages yet.</p>';
    var o=list.map(function(r){var p={};cols.forEach(function(k,i){p[k]=r[i]});return p});
    return '<div class="ptbl"><table><tr><th>Player</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG%</th><th>3P%</th></tr>'+o.map(function(p){
      return '<tr><td>'+esc(p.name)+'<small>'+esc(p.pos)+'</small></td><td>'+p.gp+'</td><td>'+p.min+'</td><td class="p">'+p.pts+'</td><td>'+p.reb+'</td><td>'+p.ast+'</td><td>'+p.stl+'</td><td>'+p.blk+'</td><td>'+p.fgPct+'</td><td>'+p.tpPct+'</td></tr>';
    }).join("")+'</table></div>';
  }

  /* most likely to beat or miss his average: calls and reasons from project-players.ps1, extra news lines from pregame.js (ouNotes) */
  function ouSection(g,m){
    var ou=m.proj.ou,notes=g.ouNotes||{},pct=function(v){return Math.round(v*100)+"%"};
    var h='<section class="blk"><h2>Over or under his average</h2>';
    if(ou.preseason) return h+'<p class="caveat">These start on opening night. In preseason, starters play about half their usual minutes, so nearly every regular-season average looks like an under.</p></section>';
    if(!(ou.calls||[]).length) return h+'<p class="note">No strong calls for this game.</p></section>';
    h+='<div class="ou">';
    ou.calls.forEach(function(c){
      var why=(notes[c.name]?["News: "+notes[c.name]]:[]).concat(c.why||[]);
      h+='<div class="oc"><div class="hd"><span class="who">'+esc(c.name)+'</span><span class="dir '+c.call+'">'+esc(c.call)+' '+c.avg+' '+esc(c.label)+'</span></div>'+
        '<div class="odds">Projected <b>'+c.proj+'</b> · about <b>'+pct(c.chance)+'</b> to go '+esc(c.call)+(c.similarHit?' · similar calls hit '+pct(c.similarHit)+' last season':'')+'</div>'+
        '<ul>'+why.map(function(w){return '<li>'+esc(w)+'</li>'}).join("")+'</ul></div>';
    });
    h+='</div><p class="note">Average = his regular-season average from box scores ('+esc(ou.calls[0].avgBasis)+' for '+esc(ou.calls[0].name)+'). Tested on 2025-26: the top three calls per team each game hit '+pct(ou.leagueTop3)+' league-wide and '+pct(ou.pistonsTop3)+' in Pistons games. Taking the under every time hit '+pct(ou.allUnder)+'. Fan analysis, not betting advice.</p>';
    return h+'</section>';
  }

  /* projected lines: model numbers from matchup.js, Claude's per-player notes from pregame.js */
  function projSection(g,m){
    var pj=m.proj,cols=pj.cols.split(","),notes=g.projNotes||{},a=pj.accuracy||{};
    var rows=pj.rows.map(function(r){var o={};cols.forEach(function(k,i){o[k]=r[i]});return o});
    var h='<section class="blk"><h2>Projected lines <span class="eyebrow">'+esc(m.det.abbr)+' rotation</span></h2>';
    if(pj.preseason) h+='<p class="caveat">Preseason: minutes follow this preseason\'s actual playing time, and coaches change rotations on a whim. Treat these as rough.</p>';
    if(g.projNote) h+='<p class="caveat">'+esc(g.projNote)+'</p>';
    h+='<div class="proj"><table><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th></tr>';
    rows.forEach(function(p){
      var n=notes[p.name];
      h+='<tr><td class="nm"><span>'+esc(p.name)+'</span>'+(n?'<small>'+esc(n)+'</small>':'')+'</td><td class="mn">'+p.min+'</td>'+
        ['pts','reb','ast','tpm'].map(function(k){return '<td><b>'+p[k]+'</b><small>'+esc(p[k+"Range"])+'</small></td>'}).join("")+'</tr>';
    });
    h+='</table></div>';
    var bits=[];
    if(pj.out&&pj.out.length) bits.push("Out: "+pj.out.join(", ")+".");
    if(pj.impliedPts) bits.push("Points are pulled toward the betting line's "+pj.impliedPts+" for "+m.det.abbr+".");
    bits.push(pj.rangeNote+" Box scores through "+dt(pj.through,{month:"short",day:"numeric",year:"numeric"})+".");
    h+='<p class="note">'+esc(bits.join(" "))+'</p>';
    h+='<details class="howto"><summary>How these are made</summary><span>Each player\'s per-minute production, weighted toward recent games, times projected minutes. Then adjusted for what this opponent allows to guards, forwards or centers compared with what those players usually do, nudged toward the betting line\'s team total, and rebalanced to 240 team minutes when someone is out. Head-to-head history was tested and left out because it added noise.</span>'+
      (a.pts?'<span>Tested on every 2025-26 game, using only earlier games: off by '+a.pts+' points on average (season averages: '+a.ptsAvg+'), '+a.reb+' rebounds ('+a.rebAvg+'), '+a.ast+' assists ('+a.astAvg+'), '+a.tpm+' threes ('+a.tpmAvg+').</span>':'')+
      '<span>Fan analysis, not betting advice.</span></details>';
    return h+'</section>';
  }

  function render(g){
    current=g;
    var m=MU[g.id]||null, h=[];
    var tip=new Date(m?m.tipUtc:g.tip);
    var home=m?m.home:g.home;
    var det=m?m.det:{abbr:"DET",short:"Pistons",record:{}}, opp=m?m.opp:(g.opp||{});
    var away=home?opp:det, hm=home?det:opp;
    function side(t,cls){
      var rec=t.record&&t.record.total?t.record.total:"";
      return '<div class="side'+cls+'"><span class="nm">'+esc(t.short||t.abbr)+'</span><span class="rec">'+esc(rec)+(t.streak&&t.streak!=="-"?" · "+esc(t.streak):"")+'</span>'+(t.standing?'<span class="st">'+esc(t.standing)+'</span>':'')+'</div>';
    }
    var tv=(m&&m.tv&&m.tv.length?m.tv:(g.tv?[g.tv]:[])).join(", ");
    h.push('<div class="fade">');
    h.push('<div class="band"><div class="band-in">');
    h.push('<div class="meta"><span class="pill">'+esc(g.phase||"Pregame")+'</span><span>'+esc(tip.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}))+'</span><span>'+(home?"vs ":"at ")+esc(opp.name||"")+'</span></div>');
    h.push('<div class="teams">'+side(away,"")+'<span class="at">AT</span>'+side(hm," r")+'</div>');
    h.push('<div class="tip"><div><div class="lbl" id="clocklbl">Until tip</div><div class="clock" id="clock"></div></div><div class="when"><b>'+esc(tip.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZoneName:"short"}))+'</b><br>'+esc(m?m.venue:(g.venue||""))+(tv?'<br>TV: '+esc(tv):'')+'</div></div>');
    h.push('</div></div>');

    h.push('<div class="head"><span class="eyebrow">Game preview</span><h1>'+esc(g.headline)+'</h1><p>'+esc(g.dek)+'</p></div>');

    if((g.keys||[]).length){
      h.push('<section class="blk"><h2>Keys to the game</h2><ol class="keys">');
      g.keys.forEach(function(k){h.push('<li><div><b>'+esc(k.title)+'</b><span>'+esc(k.text)+'</span></div></li>')});
      h.push('</ol></section>');
    }

    if((g.watch||[]).length){
      h.push('<section class="blk"><h2>Who to watch</h2><div class="leaders">');
      g.watch.forEach(function(l){
        var mine=l.team==="DET";
        h.push('<div class="ld"><span class="tm'+(mine?"":" opp")+'">'+esc(l.team)+'</span><div><div class="who">'+esc(l.name)+(l.badge?' <span class="badge">'+esc(l.badge)+'</span>':'')+'</div><div class="stat">'+esc(l.line)+'</div>'+(l.sub?'<div class="sub">'+esc(l.sub)+'</div>':'')+'</div></div>');
      });
      h.push('</div></section>');
    }

    if(m){
      h.push('<section class="blk"><h2>Injury report</h2><div class="inj">'+injList(det.abbr,m.injuries.det)+injList(opp.abbr,m.injuries.opp)+'</div>'+(g.injuryNote?'<p class="note">'+esc(g.injuryNote)+'</p>':'')+'</section>');
    }

    if(m&&m.proj&&m.proj.ou) h.push(ouSection(g,m));
    if(m&&m.proj&&(m.proj.rows||[]).length) h.push(projSection(g,m));

    if((g.talkingPoints||[]).length){
      h.push('<section class="blk"><h2>Talking points <span class="eyebrow">for the drive in</span></h2><ul class="tp">');
      g.talkingPoints.forEach(function(t){h.push('<li>'+esc(t)+'</li>')});
      h.push('</ul></section>');
    }

    if(m&&m.stats&&m.stats.det){
      h.push('<section class="blk"><h2>Tale of the tape</h2><div class="chart"><div class="sub">Per-game team averages, '+esc(m.stats.det.season+" "+m.stats.det.seasonType)+' ('+m.stats.det.gp+' games)</div><div class="legend"><span><i style="background:'+DET+'"></i>'+esc(det.abbr)+'</span><span><i style="background:'+OPP+'"></i>'+esc(opp.abbr)+'</span></div><div id="tape"></div></div></section>');
    }

    if(m){
      h.push('<section class="blk"><h2>Last five</h2><div class="form">'+formRow(det.abbr,m.form.det)+formRow(opp.abbr,m.form.opp)+'</div></section>');
      h.push('<section class="blk"><h2>Rotation averages</h2><div class="seg" role="group" aria-label="Team"><button type="button" id="seg-det" aria-pressed="true">'+esc(det.abbr)+'</button><button type="button" id="seg-opp" aria-pressed="false">'+esc(opp.abbr)+'</button></div><div id="ptbl">'+playerTable(m,"det")+'</div><p class="note">'+esc(m.playerSeason)+' per-game averages for players on the current roster.</p></section>');
    }

    var facts=[];
    if(m&&m.series&&m.series.summary) facts.push(["Season series",m.series.summary]);
    if(m&&m.odds&&(m.odds.details||m.odds.overUnder)) facts.push(["Line",[m.odds.details,m.odds.overUnder?"O/U "+m.odds.overUnder:""].filter(Boolean).join(" · ")+(m.odds.provider?" ("+m.odds.provider+")":"")]);
    if(m){[det,opp].forEach(function(t){if(t.restDays!=null&&t.restDays>=0&&t.restDays<=7)facts.push([t.abbr+" rest",t.restDays===0?"Back-to-back":t.restDays+" day"+(t.restDays===1?"":"s")+" off"])})}
    (g.facts||[]).forEach(function(f){facts.push([f.label,f.text])});
    if(facts.length){
      h.push('<section class="blk"><h2>Need to know</h2><div class="facts">');
      facts.forEach(function(f){h.push('<div><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>')});
      h.push('</div></section>');
    }

    if(g.pick){
      h.push('<section class="blk"><h2>The call</h2><div class="call"><span class="pk">'+esc(g.pick.call)+'</span><p>'+esc(g.pick.text)+'</p></div></section>');
    }

    h.push('<section class="blk"><h2>Share</h2><p class="sharetext" id="sharetext">'+esc(g.share)+'</p><div class="btns"><button type="button" class="btn pri" id="cptext">Copy text</button></div><div class="toast" id="toast" role="status"></div></section>');

    if((g.sources||[]).length){
      h.push('<div class="sources"><span>Sources:</span>');
      g.sources.forEach(function(s){h.push('<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>')});
      h.push('</div>');
    }
    h.push('</div>');
    app.innerHTML=h.join("");

    tickClock(tip); if(timer)clearInterval(timer); timer=setInterval(function(){tickClock(tip)},30000);
    var tapeEl=document.getElementById("tape"); if(tapeEl) tape(tapeEl,m);
    if(m){
      var sd=document.getElementById("seg-det"),so=document.getElementById("seg-opp"),pt=document.getElementById("ptbl");
      sd.onclick=function(){sd.setAttribute("aria-pressed","true");so.setAttribute("aria-pressed","false");pt.innerHTML=playerTable(m,"det")};
      so.onclick=function(){so.setAttribute("aria-pressed","true");sd.setAttribute("aria-pressed","false");pt.innerHTML=playerTable(m,"opp")};
    }
    document.getElementById("cptext").onclick=function(){
      var t=document.getElementById("toast");
      try{navigator.clipboard.writeText(g.share).then(function(){t.textContent="Copied"},function(){selectShare();t.textContent="Text selected. Copy it from here."})}
      catch(e){selectShare();t.textContent="Text selected. Copy it from here."}
    };
    renderArchive();
  }
  function selectShare(){var el=document.getElementById("sharetext"),r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}

  function renderArchive(){
    var a=document.getElementById("arch");
    if(!games.length){a.innerHTML='<p class="muted">Previews appear here before each game.</p>';return}
    a.innerHTML=games.map(function(g){
      var m=MU[g.id],home=m?m.home:g.home,opp=m?m.opp:(g.opp||{});
      return '<button type="button" class="arow" data-id="'+esc(g.id)+'" aria-current="'+(g===current)+'"><span class="d">'+esc(dt(g.date,{month:"short",day:"numeric"}))+'</span><span class="t">'+(home?"vs ":"at ")+esc(opp.name||"")+'</span><span class="s">'+esc(g.phase||"")+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(a.querySelectorAll(".arow"),function(b){
      b.onclick=function(){var g=find(b.getAttribute("data-id"));if(g){render(g);try{history.replaceState(null,"","#"+g.id)}catch(e){};window.scrollTo({top:0,behavior:"smooth"})}};
    });
  }

  var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){var el=document.getElementById("tape");if(el&&current)tape(el,MU[current.id])},150)});

  if(games.length){var hh=(location.hash||"").slice(1);render(find(hh)||games[0])}
  else renderArchive();
})();
</script>
</body>
</html>
