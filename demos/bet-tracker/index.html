<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bet Room — demo</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Demo-only strip. Uses the app's own tokens so it follows the theme. */
  .demobar{font-size:12.5px;line-height:1.45;padding:8px 34px 8px 14px;
    background:color-mix(in srgb,var(--edit) 16%,var(--ground));
    border-bottom:1px solid color-mix(in srgb,var(--edit) 40%,transparent);color:inherit}
  .demobar b{color:var(--edit);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    font-size:11px;margin-right:6px}
  .demobar button{font:inherit;color:inherit;background:none;border:0;padding:0;
    text-decoration:underline;cursor:pointer}
</style>
<script>
  /* Every visit starts fresh: skip the room password, forget the seat and the
     admin PIN, keep only the theme someone picked. Uses its own keys, so it
     never touches the real app's storage on the same site. */
  try {
    ["player", "admin", "device"].forEach(k => localStorage.removeItem("betroom-demo." + k));
    localStorage.setItem("betroom-demo.pw", "1");
  } catch (e) { /* storage blocked: the app still runs, it just asks for a password (any works) */ }
</script>
</head>
<body>
  <div class="demobar"><b>Demo</b>Made-up people, fake money, nothing saved — reload to start over.
    The others pick sides on anything you post. Admin PIN: any number.</div>
  <div class="dot" id="live" title="realtime connection"></div>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
