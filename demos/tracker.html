<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>DQA Dashboard</title>
<style>
*{box-sizing:border-box}
html{font-size:var(--fs,15px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font,"Segoe UI",Calibri,Arial,sans-serif);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.brand{font-weight:700;font-size:1.1rem;white-space:nowrap;flex:none}
.brand small{font-weight:400;color:var(--muted);margin-left:8px}
nav.tabs{display:flex;gap:2px;flex-wrap:nowrap;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}   /* one row always: if space runs out the tabs scroll sideways */
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
nav.tabs button{background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;flex:none}
nav.tabs button:hover{background:var(--soft);color:var(--ink)}
nav.tabs button.on{background:var(--soft);color:var(--accent)}
.status{font-size:.82rem;color:var(--muted);white-space:nowrap;cursor:default;flex:none}
.status .stx{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.status.err{color:var(--r-tx);font-weight:600;cursor:pointer}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e9b5b;margin-right:6px;vertical-align:1px}
.status.err .dot{background:var(--r-bd)}
.status.wait .dot{background:var(--a-bd)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
h1.pg{font-size:1.35rem;margin:4px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2{font-size:1.05rem;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:3px 9px;font-size:.84rem}
.btn.danger{background:transparent;color:var(--r-tx);border-color:var(--r-bd)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 3px}
.grid{display:grid;gap:10px 14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1}
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap;vertical-align:middle}
.chip.client{background:var(--accent);color:var(--accent-ink)}
.chip.aud-Client{background:var(--accent);color:var(--accent-ink)}
.chip.aud-Internal{background:var(--soft);color:var(--ink)}
.chip.aud-Saved{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.adhoc{background:#7c3aed;color:#fff}
.chip.auto-Converted,.chip.auto-Automated{background:#1f7a46;color:#fff}
.chip.auto-Can{background:var(--a-bg);color:var(--a-tx);border:1px solid var(--a-bd)}
.chip.auto-Manual{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:var(--a-bg);color:var(--a-tx);border:1px solid var(--a-bd)}
.chip.ooo{background:var(--soft);border:1px dashed var(--accent);color:var(--accent)}
.chip.open{background:#1f7a46;color:#fff}
.chip.missed{background:var(--r-bg);color:var(--r-tx);border:1px solid var(--r-bd)}
/* banners */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:9px;margin:0 0 12px;border:1px solid var(--line);background:var(--card)}
.banner.red{background:var(--r-bg);border-color:var(--r-bd);color:var(--r-tx);font-weight:600}
.banner.amber{background:var(--a-bg);border-color:var(--a-bd);color:var(--a-tx)}
.banner.info{background:var(--soft);border-color:var(--accent)}
.banner .grow{min-width:200px}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 14px}
.day{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:left;min-width:0}
.day:hover{border-color:var(--accent)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.off{opacity:.6;background:repeating-linear-gradient(135deg,transparent 0 7px,var(--soft) 7px 14px)}
.day.sel{opacity:1;background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.day .dayhit{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:inherit;background:none;cursor:pointer;z-index:1}   /* the whole card opens the day; the pencil sits above it */
.day .dayhit:focus-visible{outline-offset:2px}
.day .dn{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:22px}
.day .dtools{display:inline-flex;align-items:center;gap:6px}
.day .dcap{position:relative;z-index:2;width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.day .dcap:hover{border-color:var(--accent);color:var(--accent)}
.day .dcap svg{width:12px;height:12px;display:block}
.daypanel .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.daypanel .dhead h2{margin:0;font-size:1.15rem}
.day .meter{height:6px;background:var(--soft);border-radius:4px;margin:6px 0 3px;overflow:hidden}
.day .meter i{display:block;height:100%;background:var(--hl,var(--accent))}
.day .meter i.over{background:var(--a-bd)}
.day .hrs{font-size:.78rem;color:var(--muted)}
.day .tag{font-size:.7rem;color:var(--muted)}
.stripnav{display:flex;align-items:center;gap:6px;margin:0 0 6px}
/* list groups */
.grp{margin:0 0 16px}
.grp>h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.grp>h3 .n{background:var(--soft);color:var(--ink);border-radius:99px;padding:0 8px;font-size:.75rem}
.grp.overdue>h3{color:var(--r-tx)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:10px 14px;border-bottom:1px solid var(--line);border-left:5px solid transparent;transition:opacity .4s,background .4s}
.row:last-child{border-bottom:0}
.row.lv1{background:var(--a-bg);border-left-color:var(--a-bd)}
.row.lv2{background:var(--o-bg);border-left-color:var(--o-bd)}
.row.lv3{background:var(--r-bg);border-left-color:var(--r-bd)}
.row.today{border-left-color:var(--accent)}
.row.winopen{box-shadow:inset 0 0 0 2px #1f7a46}
.row.fading{opacity:.45}
.row.fading .nm{text-decoration:line-through}
.row.closed{opacity:.62}
.row .nm{font-weight:650;font-size:1rem;overflow-wrap:anywhere}
.row .tl{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.step{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 11px 3px 8px;cursor:pointer;background:var(--card);user-select:none;font-size:.88rem}
.step:hover{border-color:var(--accent)}
.step input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.step.on{background:var(--soft);border-color:var(--accent)}
.step small{color:var(--muted);font-size:.74rem}
.side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.due{font-weight:650}
.due.lvtxt1{color:var(--a-tx)}.due.lvtxt2{color:var(--o-tx)}.due.lvtxt3{color:var(--r-tx)}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.det{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.det .grid{margin-bottom:8px}
.instr{white-space:pre-wrap;background:var(--soft);padding:8px 10px;border-radius:7px;font-size:.9rem}
.cl{display:flex;flex-direction:column;gap:3px;margin:4px 0}
.cl label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto}
/* calendar */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mon h4{margin:0 0 4px;font-size:.9rem}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.78rem}
.mg .h{color:var(--muted);text-align:center;font-weight:700}
.mg .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;position:relative;cursor:pointer;border:1px solid transparent;background:var(--card)}
.mg .c:hover{border-color:var(--accent)}
.mg .c.we{color:var(--muted);background:transparent}
.mg .c.hol{background:#2e9b5b33;font-weight:700}
.mg .c.pto{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mg .c.half{background:linear-gradient(135deg,var(--accent) 50%,var(--soft) 50%);color:var(--ink)}
.mg .c.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mg .c.td{border-color:var(--ink);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;max-width:min(720px,94vw);width:100%}
dialog::backdrop{background:#0008}
.dlg-h{padding:14px 18px 6px;font-weight:700;font-size:1.1rem}
.dlg-b{padding:6px 18px 12px;max-height:68vh;overflow:auto}
.dlg-f{padding:10px 18px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
#toasts{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 18px #0004;max-width:min(520px,90vw)}
.toast button{background:none;border:0;color:var(--accent-on-ink,#9cc7ff);font-weight:700;cursor:pointer;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.welcome{max-width:720px;margin:30px auto}
.welcome .btn{margin:4px 8px 4px 0}
.note-item{border-bottom:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.note-item:last-child{border-bottom:0}
.note-item pre{margin:0;white-space:pre-wrap;font:inherit}
.dayhd{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
kbd{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.85em}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.sum .pill{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.88rem}
.sum .pill.on{border-color:var(--accent);background:var(--soft)}
.prog{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:#1f7a46}
@media (max-width:760px){.row{grid-template-columns:1fr}.side{align-items:flex-start;text-align:left}.acts{justify-content:flex-start}.strip{grid-template-columns:repeat(5,minmax(96px,1fr));overflow-x:auto}}
@media print{header.top,#toasts,.noprint,nav{display:none!important}body{background:#fff;color:#000}.card{border:0}main{padding:0}}

/* time tracking */
.tnow{border-left:5px solid var(--line)}
.tnow.on{border-left-color:var(--accent)}
.tnow.idle{background:var(--a-bg);border-color:var(--a-bd);color:var(--a-tx)}
.tnow.idle .muted{color:inherit;opacity:.85}
.tnow-in{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.tnow-in>.grow{flex:1 1 200px;min-width:200px}
.tnow-n{font-weight:700;font-size:1.25rem;overflow-wrap:anywhere}
.tclock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tprog{margin-top:10px}
.tprog .prog{height:10px}
.tprog .prog i.over{background:var(--a-bd)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.tile:hover{border-color:var(--accent)}
.tile.brk{border-style:dashed}
.tile .tn{font-weight:650;line-height:1.25}
.tile .ts{font-size:.76rem;color:var(--muted)}
.tile .tt{margin-top:auto;padding-top:4px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.run .ts,.tile.run .tt{color:inherit;opacity:.9}
.tcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}
.tpill{display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--soft);border:1px solid var(--accent);border-radius:99px;padding:2px 3px 2px 9px;font-size:.8rem;line-height:1.35}
.tpill.stale{background:var(--a-bg);border-color:var(--a-bd);color:var(--a-tx)}
.tpill i{width:7px;height:7px;border-radius:50%;background:#d32f2f;flex:none;animation:tpulse 1.4s ease-in-out infinite}
.tpill .lnk{display:block;background:none;border:0;padding:0;font-weight:700;cursor:pointer;color:inherit;max-width:var(--tq,150px);overflow:hidden;white-space:nowrap}
.tpill .lnk>span{display:inline-block}
.tpill .lnk.scroll{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 12px),transparent)}
.tpill .lnk.scroll>span{padding-right:12px;animation:tmq var(--dur,8s) ease-in-out infinite alternate}
.tpill .tc{font-variant-numeric:tabular-nums;font-weight:600}
.tpill .tstop{flex:none;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:var(--accent);cursor:pointer;display:inline-grid;place-items:center}
.tpill .tstop::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--accent-ink)}
.tpill .tstop:hover{filter:brightness(1.1)}
.tpill.stale .tstop{background:var(--a-bd)}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tmq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--shift,0))}}
@media (prefers-reduced-motion:reduce){.tpill i{animation:none}.tpill .lnk{text-overflow:ellipsis}.tpill .lnk>span,.tpill .lnk.scroll>span{display:inline;animation:none;padding:0}.tpill .lnk.scroll{-webkit-mask-image:none;mask-image:none}}
@media (max-width:1240px){.status:not(.err) .stx{display:none}.brand small{display:none}}
@media (max-width:1000px){.tpill{--tq:100px}.status .stx{max-width:120px}nav.tabs button{padding:7px 8px}.top-in{gap:10px}}
@media (max-width:760px){.brand{display:none}.tpill{--tq:70px}.status .stx{display:none}}
@media (max-width:900px){.tcols{grid-template-columns:1fr}}
@media (max-width:560px){.tclock{font-size:1.5rem}.tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.row.timing{box-shadow:inset 0 0 0 2px var(--accent)}
.btn.timing{background:#d32f2f;border-color:#d32f2f;color:#fff}
.tpill.idle{background:transparent;border:1px dashed var(--muted);color:var(--muted);cursor:pointer;padding:3px 10px 3px 9px;font-weight:600;white-space:nowrap}
.tpill.idle i{background:var(--muted);animation:none}
.tpill.idle.warn{background:var(--a-bg);border:1px solid var(--a-bd);color:var(--a-tx)}
.tpill.idle.warn i{background:var(--a-bd)}
.btn.hasnote{background:var(--a-bg);border-color:var(--a-bd);color:var(--a-tx)}
.btn.hasnote:hover{background:var(--a-bg);filter:brightness(.97)}
.btn.hasnote::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a-bd);margin-right:6px;vertical-align:1px}

.chip.from{background:var(--soft);border:1px dashed var(--accent)}
[data-act][tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.chip.tk{background:var(--card);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.banner.slim{padding:3px 10px;margin:0 0 6px;font-size:.85rem;gap:8px;background:var(--card);border-style:dashed}
.banner .bmin{margin-left:auto}
.mg .c.h1{background:color-mix(in srgb,var(--hl,var(--accent)) 16%,var(--card))}
.mg .c.h2{background:color-mix(in srgb,var(--hl,var(--accent)) 34%,var(--card))}
.mg .c.h3{background:color-mix(in srgb,var(--hl,var(--accent)) 55%,var(--card))}
.mg .c.h4{background:color-mix(in srgb,var(--hl,var(--accent)) 80%,var(--card));color:var(--hl-ink,var(--accent-ink));font-weight:700}
.mg .c.hx{background:var(--r-bg);color:var(--r-tx);font-weight:700;box-shadow:inset 0 0 0 2px var(--r-bd)}
.mg .c.hxo{box-shadow:inset 0 0 0 2px var(--r-bd)}

#alerts{position:fixed;top:64px;right:16px;z-index:58;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px))}
#alerts:empty{display:none}
.alert{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px #0003;animation:alertIn .25s ease-out}
.alert.warn{border-left-color:var(--a-bd)}
.alert.red{border-left-color:var(--r-bd)}
.alert .ah{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.alert .ah .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:1.15rem;line-height:1;padding:0 2px}
.alert .ab{font-size:.9rem;margin:3px 0 8px;overflow-wrap:anywhere}
.alert .aa{display:flex;gap:6px;flex-wrap:wrap}
@keyframes alertIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.alert{animation:none}}
@media print{#alerts{display:none}}
.mg .c.pay::after{content:"$";position:absolute;right:-4px;top:-5px;width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;background:#1f7a46;color:#fff;font-size:.72rem;font-weight:800;box-shadow:0 0 0 1.5px var(--card);z-index:2}
</style>
</head>
<body>
<header class="top" id="hdr"></header>

  const flex = [];

    if (isClosed(it) || !it.due || isAwaiting(it)) continue;
    if (it.workOn) { const w = it.workOn; ctx.load[w] = (ctx.load[w] || 0) + minsOf(it); continue; }

/* ---------- modal / toast ---------- */
function modal(o) {
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.innerHTML = `<form method="dialog"><div class="dlg-h">${esc(o.title)}</div><div class="dlg-b">${o.body}<div class="small" id="dlgErr" style="color:var(--r-tx);font-weight:600;margin-top:8px"></div></div><div class="dlg-f">${(o.buttons || [{ label: 'OK', value: 'ok', primary: true }]).map((b, i) => `<button type="button" class="btn ${b.primary ? '' : 'ghost'} ${b.danger ? 'danger' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></form>`;
    document.body.appendChild(dlg);
    let settled = false;
    const done = (val, data) => { if (settled) return; settled = true; try { dlg.close(); } catch (e) {} dlg.remove(); resolve({ value: val, data }); };
    dlg.addEventListener('cancel', e => { e.preventDefault(); done(null); });
    dlg.querySelector('form').addEventListener('submit', e => e.preventDefault());   // Enter in a lone field must not close the dialog behind our back
    dlg.addEventListener('close', () => done(null));
    dlg.querySelectorAll('.dlg-f button').forEach(bt => bt.addEventListener('click', () => {
      const b = o.buttons[+bt.dataset.i];
      if (b.validate !== false && b.primary && o.validate) { const msg = o.validate(dlg); if (msg) { $('#dlgErr', dlg).textContent = msg; return; } }
      done(b.value, b.primary && o.collect ? o.collect(dlg) : undefined);
    }));
    dlg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && o.enterSubmits !== false) { e.preventDefault(); const p = dlg.querySelector('.dlg-f button:not(.ghost)'); if (p) p.click(); } });
    dlg.showModal();
    if (o.onOpen) o.onOpen(dlg);
    const first = dlg.querySelector('input:not([type=checkbox]),textarea,select'); if (first && !o.noFocus) first.focus();
  });
}
function toast(msg, o) {
  o = o || {}; const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${o.undo ? '<button>Undo</button>' : ''}`;
  box.appendChild(el); const kill = () => { clearTimeout(tm); el.remove(); };
  const tm = setTimeout(kill, o.ms || (o.undo ? 9000 : 3500));

}
let lastErrAt = 0;
function reportError(err) {         // anything unexpected is shown, never silent; saving is separate, so the file on disk is not affected

  const msg = String((err && (err.message || err.reason)) || err || 'unknown error').slice(0, 160);

}

  } else { for (let j = i; j < defs.length; j++) it.steps[defs[j][0]] = null; }

/* ---------- coverage ---------- */
function coverageRows(start, end, entry) {
  const rows = [], seen = new Set();
  const firstBD = Core.onOrNextBD(start);
  const back = nextBD(end);
  const push = (r) => { if (!seen.has(r.key)) { seen.add(r.key); rows.push(r); } };
  const cover = entry && entry.cover ? entry.cover : {};
  const byKey = new Map(); for (const i of S.items) if (i.key) byKey.set(i.key, i);
  const mk = (src, due, key, tpl, it) => {
    const half = offState(due) === 0.5;
    const t = tpl || tplOf(it || {}) || null;
    return { key, due, name: src.name, client: src.client || '', audience: src.audience || '', dueTime: src.dueTime || '', win: src.winStart && src.winEnd ? src.winStart + ' - ' + src.winEnd : '', minutes: src.minutes || 0,
      link: src.link || (t && t.link) || '', instr: t ? (t.notes || '') : '', occNotes: it ? (it.notes || '') : '', automation: t ? (t.automation || '') : '', kind: src.kind,
      who: cover[key] != null ? cover[key] : ((t && t.backup) || (entry && entry.backup) || ''), half, itemId: it ? it.id : null, phase: due === back ? 'back' : (due === firstBD ? 'prep' : 'while') };
  };
  for (const t of S.templates) {
    if (!t.active || !Core.ruleComplete(t)) continue;
    for (const due of Core.occurrences(t, start, back)) {
      if (due !== back && !isBD(due)) continue;
      const key = t.id + '|' + due; const it = byKey.get(key);
      if (it && isClosed(it)) continue;
      push(mk(it || t, due, key, t, it));
    }
  }
  for (const it of S.items) {
    if (it.tplId || !it.due || isClosed(it) || it.due < start || it.due > back) continue;
    push(mk(it, it.due, it.id, null, it));
  }
  rows.sort((a, b) => a.due.localeCompare(b.due) || (Core.audRank(a.audience) - Core.audRank(b.audience)) || (parseTime(a.dueTime) || 9999) - (parseTime(b.dueTime) || 9999) || a.name.localeCompare(b.name));
  return rows;
}

/* ---------- setup workbook import ---------- */
const SET_LABEL = { name: 'Your name', preset: 'Color preset', mode: 'Light / dark mode', font: 'Font', size: 'Font size', capacityHours: 'Daily capacity', leadBD: 'Default work-ahead', payAnchor: 'Pay day anchor', payEvery: 'Pay day interval' };

  const res = { settings: setChanges.length, setChanges, add: 0, upd: 0, same: 0, missing: [], missingActive: 0, holidays: p.holidays ? p.holidays.length : null,
    holChanged: !!p.holidays && holSig(p.holidays) !== holSig(S.holidays), clChanged: !!p.checklists && Object.keys(p.checklists).some(k => JSON.stringify(p.checklists[k]) !== JSON.stringify(S.checklists[k])) };

}

}
const tplByName = () => new Map(S.templates.map(x => [x.kind + '|' + x.name.toLowerCase(), x]));

function sanitizeTpl(t) { const o = {}; TPL_FIELDS.forEach(k => { o[k] = t[k] == null ? '' : t[k]; }); o.days = (t.days || []).slice().sort(); o.months = (t.months || []).slice().sort((a, b) => a - b); return o; }

/* what an imported row sets on a report the tracker already has: the due rule always, any other field only when its column is in the

function rowFields(t) { const o = {}, has = t._has || TPL_FIELDS; Object.keys(t).forEach(k => { if (k[0] !== '_' && (Setup.RULE_KEYS.includes(k) || has.includes(k))) o[k] = t[k]; }); return o; }

/* ---------- work list ---------- */
function horizonFor(r) { const t = D.today(); return r === 'day' ? t : r === 'week' ? weekEnd() : r === 'month' ? D.monthEnd(t) : D.quarterEnd(t); }
function passFilters(it) {

  if (p.type === 'tasks' && it.kind !== 'task') return false;
  if (p.client && (it.client || '') !== p.client) return false;
  if (U.q) { const q = U.q.toLowerCase(); if (!((it.name || '') + ' ' + (it.client || '') + ' ' + (it.requester || '') + ' ' + (it.keywords || '') + ' ' + (it.ticket || '')).toLowerCase().includes(q)) return false; }

    const tp = tplOf(it); if (tp && tp.cadence === 'Daily' && it.due > D.today()) continue;   // daily items only matter on their own day
    const inf = infoOf(it);

    (Core.audRank(a.it.audience) - Core.audRank(b.it.audience)) || (tmin(a.it) - tmin(b.it)) || a.it.name.localeCompare(b.it.name);
  Object.values(out).forEach(a => a.sort(cmp));

/* ---------- calendar: workload heatmap ---------- */
let HEATNOW = null, HEATYR = 0;
function workloadYear(yr) {
  const from = D.of(yr, 1, 1), to = D.of(yr, 12, 31), days = {}, month = {}, one = U.calHeatOne !== false;
  const add = (iso, row) => { const e = days[iso] || (days[iso] = { mins: 0, rows: [] }); e.mins += row.mins; e.rows.push(row); const m = +iso.slice(5, 7); month[m] = (month[m] || 0) + row.mins; };
  for (const t of S.templates) {
    if (!t.active || !Core.ruleComplete(t)) continue;
    const m = t.minutes > 0 ? +t.minutes : DEFAULT_MIN;
    for (const due of Core.occurrences(t, from, to)) add(due, { name: t.name, client: t.client || '', mins: m, kind: t.kind });
  }
  if (one) for (const it of S.items) { if (it.tplId || !it.due || it.skipped || it.due < from || it.due > to) continue; add(it.due, { name: it.name, client: it.client || '', mins: minsOf(it), kind: it.kind, one: true }); }
  return { days, month };
}
function heatLevel(mins, cap) {
  if (!mins) return 0; if (cap <= 0) return 'x';
  const r = mins / (cap * 60); return r <= 0.25 ? 1 : r <= 0.5 ? 2 : r <= 0.75 ? 3 : r <= 1 ? 4 : 'x';
}
function heatCell(iso, cls) {
  const e = HEATNOW && HEATNOW.days[iso]; if (!e || !e.mins) return { tip: '' };
  const cap = capHours(iso), lv = heatLevel(e.mins, cap), pct = cap > 0 ? Math.round(e.mins / (cap * 60) * 100) : 0;
  const tip = ' · ' + fmtDur(e.mins) + ' due (' + plural(e.rows.length, 'item') + ')' + (cap > 0 ? ', ' + pct + '% of ' + cap + 'h capacity' : ', due on a day off');
  if (cls.includes('pto') || cap <= 0) cls.push('hxo');
  else if (cls.includes('half')) { if (lv === 'x') cls.push('hxo'); }
  else cls.push(lv === 'x' ? 'hx' : 'h' + lv);
  return { tip };
}
function heatMonthTxt(m) { return HEATNOW && HEATNOW.month[m] ? ` <span class="small muted" style="font-weight:400">· ${esc(fmtDur(HEATNOW.month[m]))}</span>` : ''; }
function heatControls(yr) {
  const on = U.calHeat !== false, one = U.calHeatOne !== false;
  let h = `<div class="card noprint"><div class="bar" style="margin:0"><b>Workload heatmap</b><div class="seg"><button data-act="calHeat" data-v="1" class="${on ? 'on' : ''}">On</button><button data-act="calHeat" data-v="0" class="${!on ? 'on' : ''}">Off</button></div>
    <label class="small" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-chg="calHeatOne" ${one ? 'checked' : ''}> Include one-off tasks &amp; requests that have a due date</label></div>`;
  if (on && HEATNOW) {
    let tot = 0, bd = 0, over = 0; const top = [];
    for (const [iso, e] of Object.entries(HEATNOW.days)) { tot += e.mins; const cap = capHours(iso); if (cap > 0) { bd++; if (heatLevel(e.mins, cap) === 'x') over++; } if (e.mins) top.push([iso, e.mins]); }
    top.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    h += `<p class="small muted" style="margin:8px 0 4px">Each day is shaded by the estimated time of everything due that day (the report's time estimate, or 30 minutes if none is set) compared with your capacity that day. About <b>${esc(fmtDur(tot))}</b> is due in ${yr}${over ? `, and <b>${plural(over, 'day')}</b> ${over === 1 ? 'is' : 'are'} over capacity` : ''}. Click days to plan time off and see what is due.</p>
    <div class="legend" style="margin:4px 0"><span><i style="background:color-mix(in srgb,var(--hl) 16%,var(--card))"></i>Under 25%</span><span><i style="background:color-mix(in srgb,var(--hl) 34%,var(--card))"></i>25-50%</span><span><i style="background:color-mix(in srgb,var(--hl) 55%,var(--card))"></i>50-75%</span><span><i style="background:color-mix(in srgb,var(--hl) 80%,var(--card))"></i>75-100%</span><span><i style="background:var(--r-bg);border:2px solid var(--r-bd)"></i>Over capacity</span><span><i style="border:2px solid var(--r-bd)"></i>Work due on a day off</span></div>`;
    if (top.length) h += `<div class="small" style="margin-top:6px"><span class="muted">Busiest days:</span> ${top.slice(0, 6).map(([iso, m]) => `<span class="chip" style="cursor:pointer" data-act="calDay" data-v="${iso}" title="Select this day">${esc(D.fmtShort(iso))} · ${esc(fmtDur(m))}</span>`).join(' ')}</div>`;
  }
  return h + '</div>';
}
function heatSelHtml(sel) {
  if (!HEATNOW || !sel) return '';

/* ===== time.js : task timer, Changepoint summary, week / month views ===== */
const pad2 = n => String(n).padStart(2, '0');
const hms = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 3600) + ':' + pad2(Math.floor(s % 3600 / 60)) + ':' + pad2(s % 60); };
const hm = s => { const m = Math.max(0, Math.round(s / 60)); return Math.floor(m / 60) + ':' + pad2(m % 60); };
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const hhmm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const localMs = (iso, t) => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? new Date(D.y(iso), D.m(iso) - 1, D.d(iso), +m[1], +m[2], 0, 0).getTime() : null; };
const TT = () => S.time;
const taskOf = id => TT().tasks.find(t => t.id === id);
const catOf = id => TT().cats.find(c => c.id === id);
const taskLabel = id => { const x = taskOf(id); return x ? x.name + (x.sub ? ' (' + x.sub + ')' : '') : '(removed task)'; };
const isRun = e => e.start != null && e.end == null;
const runningEntry = () => TT().log.find(isRun) || null;
const secsOf = (e, now) => isRun(e) ? Math.max(0, Math.floor(((now || Date.now()) - e.start) / 1000)) : (e.secs || 0);
const fmtT = s => s > 0 ? (U.tDec ? (s / 3600).toFixed(2) : hm(s)) : '<span class="muted">–</span>';

/* ---------- totals ---------- */
let logIx = { log: null, rs: -1, n: -1, m: null };
function indexLog() {        // date -> entries; built once per render (the live clock and alerts reuse it every second)
  const log = TT().log;
  if (logIx.log === log && logIx.rs === U._rs && logIx.n === log.length) return logIx.m;
  const m = new Map(); log.forEach(e => { let a = m.get(e.date); if (!a) m.set(e.date, a = []); a.push(e); });
  logIx = { log, rs: U._rs, n: log.length, m }; return m;
}
function daySum(d, idx, now) {
  const t = TT(), cap = Math.round(t.breakCapMin * 60), by = {}, cats = {}, memo = {};
  let brk = 0, work = 0;
  ((idx || indexLog()).get(d) || []).forEach(e => {
    const s = secsOf(e, now), tk = taskOf(e.task);
    by[e.task] = (by[e.task] || 0) + s;
    if (tk && tk.kind === 'break') brk += s;
    else { work += s; const c = tk && catOf(tk.cat) ? tk.cat : '?'; cats[c] = (cats[c] || 0) + s; if (tk && tk.tag) memo[tk.tag] = (memo[tk.tag] || 0) + s; }
  });
  const paid = Math.min(brk, cap);                         // breaks count up to the daily cap, inside one category
  if (paid) cats[t.breakCat] = (cats[t.breakCat] || 0) + paid;
  const bd = isBD(d), off = bd ? offState(d) : 0, day = Math.round(t.dayHours * 3600);
  return { date: d, by, cats, memo, brk, paid, work, tracked: work + paid, pto: Math.round(day * off), target: bd ? Math.round(day * (1 - off)) : 0 };
}
function sumDays(list) {
  const r = { cats: {}, memo: {}, by: {}, brk: 0, paid: 0, work: 0, tracked: 0, pto: 0, target: 0, worked: 0 };
  list.forEach(s => {
    ['cats', 'memo', 'by'].forEach(k => { for (const id in s[k]) r[k][id] = (r[k][id] || 0) + s[k][id]; });
    ['brk', 'paid', 'work', 'tracked', 'pto', 'target'].forEach(k => { r[k] += s[k]; });

}
function cpRows(sum) {      // one row per Changepoint category, hours rounded to the chosen step

function tUndo(msg, fn) {

  toast(msg, { ms: 6000, undo: () => { S = normalize(JSON.parse(snap)); afterLoad(); save(); render(); } });
  const last = $('#toasts').lastElementChild; if (last) last.classList.add('ttoast');
}
function finishEntry(e, endMs) { e.end = endMs; e.secs = Math.max(0, Math.round((endMs - e.start) / 1000)); }
function dropTiny() { TT().log = TT().log.filter(e => !(e.start != null && e.end != null && e.secs < 3)); }   // accidental double-click
async function tStale() {
  const run = runningEntry(); if (!run) return false;
  const lateStart = localMs(run.date, '17:00'), def = hhmm(Math.max(run.start, lateStart));
  const r = await modal({ title: 'A timer was left running', enterSubmits: false,
    body: `<p><b>${esc(taskLabel(run.task))}</b> was started ${esc(D.fmtLong(run.date))} at ${clock(run.start)} and never stopped.</p><label class="f" for="st-t">What time did you actually stop? (${esc(D.fmt(run.date))})</label><input type="time" id="st-t" value="${def}">`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Delete that entry', value: 'del', danger: true }, { label: 'Stop it at that time', value: 'ok', primary: true }],
    validate: dlg => { const v = localMs(run.date, $('#st-t', dlg).value); return v == null ? 'Enter a time.' : v <= run.start ? 'That is before it started.' : ''; },
    collect: dlg => $('#st-t', dlg).value });
  if (r.value === 'ok') { tUndo('Timer stopped.', () => finishEntry(run, localMs(run.date, r.data))); return true; }
  if (r.value === 'del') { tUndo('Entry deleted.', () => { TT().log = TT().log.filter(e => e !== run); }); return true; }
  return false;
}
async function tStart(id, it) {
  const task = taskOf(id); if (!task) return;
  let run = runningEntry();
  if (run && run.date !== D.today()) { if (!(await tStale())) return; run = runningEntry(); }
  const itemId = it ? it.id : '', label = it ? itemLabel(it) : '';
  if (run && run.task === id && (run.item || '') === itemId) return tStop();
  tUndo((run ? 'Switched to ' : 'Started ') + (label ? label + ' · counts as ' + taskLabel(id) : task.name + (task.sub ? ' (' + task.sub + ')' : '')), () => {
    const now = Date.now();
    TT().log.filter(isRun).forEach(e => finishEntry(e, now));

async function tStop() {

/* ===== alerts.js : run windows opening, due times coming up, a timer left running ===== */
const AL = { list: [], seen: new Set(), snooze: {}, n: 0 };
try { const o = JSON.parse(sessionStorage.getItem('tracker-alerts') || 'null'); if (o && o.day === D.today()) { AL.seen = new Set(o.seen || []); AL.snooze = o.snooze || {}; } } catch (e) {}
function alertSave() { try { sessionStorage.setItem('tracker-alerts', JSON.stringify({ day: D.today(), seen: [...AL.seen], snooze: AL.snooze })); } catch (e) {} }
function wantedAlerts() {
  const out = [], today = D.today(), now = D.nowMin(), lead = +S.settings.alertLead >= 0 ? +S.settings.alertLead : 15;
  const who = it => it.name + (it.client && !/^(all|internal)$/i.test(it.client) ? ' (' + it.client + ')' : '');
  for (const it of S.items) {
    if (it.due !== today || isClosed(it) || isAwaiting(it)) continue;
    if (it.winStart && it.winEnd && !(it.steps && it.steps.ran)) {
      const a = parseTime(it.winStart), b = parseTime(it.winEnd);
      if (a != null && b != null && now >= a && now < b) out.push({ key: 'win|' + it.id + '|' + today, cls: '', id: it.id, title: 'Run window is open', text: `${who(it)}: run it by ${it.winEnd}.`, short: 'Run window open' });
    }
    if (it.dueTime) {
      const t = parseTime(it.dueTime);
      if (t != null && lead > 0 && now >= t - lead && now < t) out.push({ key: 'due|' + it.id + '|' + today, cls: 'warn', id: it.id, title: 'Due at ' + it.dueTime, text: `${who(it)} is due in ${plural(t - now, 'minute')}.`, short: 'Due at ' + it.dueTime });
    }
  }
  const run = runningEntry();
  if (run) {
    const nowMs = Date.now(), ds = daySum(today, null, nowMs), mins = (nowMs - run.start) / 60000, label = run.label || taskLabel(run.task);
    let why = '';
    if (run.date !== today) why = `has been running since ${D.fmt(run.date)} at ${clock(run.start)}.`;
    else if (ds.target > 0 && ds.tracked > ds.target + 30 * 60) why = `is still running, and today's total is ${hm(ds.tracked)}, past your ${TT().dayHours} h day.`;
    else if (mins >= 240) why = `has been running for ${hm(mins * 60)} straight.`;
    if (why) out.push({ key: 'timer|' + run.id, cls: 'red', timer: true, run, title: 'Is the timer still right?', text: `${label} ${why}`, short: 'Timer still running' });
  }
  return out;
}
function checkAlerts() {
  if (!Store.connected() || U.welcome || S.settings.alerts === false) { if (AL.list.length) { AL.list = []; paintAlerts(); } return; }
  const want = wantedAlerts(), keys = new Set(want.map(a => a.key)), nowMs = Date.now(); let changed = false;
  const kept = AL.list.filter(a => keys.has(a.key)); if (kept.length !== AL.list.length) changed = true;      // condition over (done, window closed, timer stopped)
  for (const a of want) {
    const cur = kept.find(x => x.key === a.key);
    if (cur) { if (cur.text !== a.text) { Object.assign(cur, a); changed = true; } continue; }
    if (a.timer ? AL.snooze[a.key] > nowMs : AL.seen.has(a.key)) continue;
    kept.push(a); AL.seen.add(a.key); changed = true;
  }

}
function paintAlerts() {
  const box = document.getElementById('alerts'); if (!box) return;
