<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Playmaker</title>
<meta name="description" content="Draw up a football play, then run it against a simulated defense.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{--bg:#0a101d;--panel:#101a2e;--line:#22314f;--txt:#e7edfb;--mut:#8d9cbd;--acc:#facc15;--blue:#3b82f6;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{position:fixed;inset:0;overflow:hidden;width:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px!important}
#installTip{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:15;background:#f8fafc;color:#0b1220;border-radius:14px;padding:12px 40px 12px 14px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#installTip b{font-weight:700}#installTip button{position:absolute;right:6px;top:6px;background:none;border:none;color:#475569;font-size:18px;padding:4px 8px}
#installTip .share{display:inline-block;width:15px;height:17px;vertical-align:-3px;border:2px solid #2563eb;border-top:none;border-radius:0 0 3px 3px;position:relative;margin:0 2px}
#installTip .share:before{content:"";position:absolute;left:4px;top:-7px;width:2px;height:12px;background:#2563eb}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto;background:#0d1526}
header{display:flex;align-items:center;gap:10px;padding:calc(7px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 7px calc(12px + env(safe-area-inset-left));background:linear-gradient(#111c33,#0d1628);border-bottom:1px solid var(--line)}
.dd{font:700 21px/1 "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;letter-spacing:.5px}
.spot{font-size:12px;color:var(--mut);margin-top:3px}
.stats{font:500 13px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;color:#cbd5f0;text-align:right;line-height:1.15}
.stats b{color:var(--acc)}
.grow{flex:1}
#wrap{flex:1;min-height:200px;position:relative;overflow:hidden}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
button{font:inherit;color:inherit;background:#1a2643;border:1px solid #2c3d63;border-radius:10px;padding:9px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.chip{padding:6px 11px;border-radius:999px;font-size:13px}
.chip.on{background:var(--acc);color:#14110a;border-color:var(--acc);font-weight:700}
.chip.red{border-color:#7f2a2a;background:#2b1620}
.snap{background:linear-gradient(#2fd36a,#16a34a);border:none;color:#03220f;font:700 18px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;letter-spacing:1.5px;padding:11px 22px;box-shadow:0 3px 0 #0c6b30}
.pbbtn{flex:1;text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{color:var(--mut);font-size:12px;margin-top:8px}
.grp{margin-top:9px}
.grp>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.selhead{display:flex;align-items:center;gap:8px}
.selhead .badge{width:30px;height:30px;border-radius:50%;background:#f8fafc;color:#1e3a8a;border:2px solid #2563eb;display:flex;align-items:center;justify-content:center;font-weight:800}
.selhead .what{flex:1;min-width:0}
.selhead .what small{display:block;color:var(--mut)}
.res{font:700 22px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;letter-spacing:.5px}
.res.good{color:#4ade80}.res.bad{color:#f87171}.res.td{color:var(--acc)}
.sub{color:#cfd8ee;margin-top:2px}
.sub2{color:var(--mut);font-size:12px;margin-top:2px}
#sheetBg{position:fixed;inset:0;background:rgba(3,6,14,.62);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheetBg.hidden{display:none}
#sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#111b30;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:82vh;overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.sh-h{display:flex;align-items:center;justify-content:space-between;font:700 18px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;position:sticky;top:-12px;background:#111b30;padding:4px 0 8px;z-index:1}
.sh-h button{padding:5px 11px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:14px 0 6px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 11px}
.item span{font-size:12px;color:var(--mut)}
.myrow{display:flex;gap:6px}
.myrow .item{flex:1}
.mut{color:var(--mut);font-size:13px}
.logi{border-bottom:1px solid #1d2a47;padding:8px 0;font-size:13px}
.logi .h{color:var(--mut);font-size:11px}
.logi.drive{color:var(--acc);font:600 13px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif;letter-spacing:.5px}
input[type=text],textarea{width:100%;background:#0b1324;border:1px solid #2c3d63;color:var(--txt);border-radius:9px;padding:9px;font:inherit}
textarea{min-height:80px;font-size:12px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#f8fafc;color:#0b1220;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.desc{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div id="dd" class="dd">1st &amp; 10</div><div id="spot" class="spot">Ball on OWN 25</div></div>
    <div class="grow"></div>
    <div class="stats" id="stats"></div>
    <button data-act="help" class="chip">?</button><button data-act="log" class="chip">Log</button>
  </header>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="panel"></div>
</div>
<div id="sheetBg" class="hidden"><div id="sheet"></div></div>
<div id="toast"></div>

<script id="engine">
// ================= ENGINE (field units: yards; x = sideline to sideline, y = own goal (0) -> opp goal (100)) =================
const FW=160/3, CX=FW/2, BALLSPD=24;
const SPD={OL:5.6,QB:6.9,RB:8.2,FB:7.2,TE:7.6,WR:8.6,DL:6.3,DE:6.9,LB:7.5,CB:8.6,S:8.3,NB:8.5};
const AGI={OL:4,QB:6,RB:9,FB:6,TE:6.5,WR:9.5,DL:4.5,DE:5,LB:6.5,CB:7.5,S:6.5,NB:7.5};
const MASS={OL:1.7,DL:1.6,DE:1.4,TE:1.2,FB:1.2,LB:1.2};
const TK={DL:0.55,DE:0.6,LB:0.66,CB:0.56,S:0.62,NB:0.58};
const DIFF={easy:{react:0.34,tk:0.82,shed:0.62,spd:0.95,cat:1.06,int:0.6,acc:0.85},
            normal:{react:0.25,tk:1,shed:1,spd:1,cat:1,int:1,acc:1},
            hard:{react:0.17,tk:1.12,shed:1.35,spd:1.03,cat:0.94,int:1.3,acc:1.08}};
const POSNAME={OL:'Offensive Lineman',QB:'Quarterback',RB:'Running Back',FB:'Fullback',TE:'Tight End',WR:'Wide Receiver'};
const ELIG={WR:1,TE:1,RB:1,FB:1};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, hyp=Math.hypot, dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let rnd=Math.random;
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function wpick(w){let s=0;for(const k in w)s+=w[k];let x=rnd()*s;for(const k in w){x-=w[k];if(x<=0)return k;}return Object.keys(w)[0];}

// ---------- offense ----------
function P(id,pos,label,x,y){return {id,pos,label,x,y,role:pos==='QB'?'pass':'block',route:null,read:0};}
function OLine(){return [['LT',-4.4,'T'],['LG',-2.2,'G'],['C',0,'C'],['RG',2.2,'G'],['RT',4.4,'T']].map(([id,x,l])=>P(id,'OL',l,x,-0.8));}
function withDefaults(arr){for(const p of arr){if(p.pos==='WR'||p.pos==='TE'||(ELIG[p.pos]&&p.y>-3))applyRoute(p,'Go');}return arr;}
const FORMS={
 'Gun Spread':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-5),P('RB','RB','R',2,-5.2),P('X','WR','X',-18,-1),P('H','WR','H',-10,-1.6),P('Y','WR','Y',10,-1.6),P('Z','WR','Z',18,-1)]),
 'Gun Trips':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-5),P('RB','RB','R',-2,-5.2),P('X','WR','X',-18,-1),P('Y','WR','Y',8,-1.6),P('H','WR','H',13,-1.6),P('Z','WR','Z',18.5,-1)]),
 'Singleback':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-1.5),P('RB','RB','R',0,-7),P('X','WR','X',-17,-1),P('H','WR','H',-10,-1.6),P('Y','TE','Y',6.6,-1),P('Z','WR','Z',16,-1)]),
 'I-Form':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-1.5),P('FB','FB','F',0,-4.3),P('RB','RB','R',0,-7),P('X','WR','X',-17,-1),P('Y','TE','Y',6.6,-1),P('Z','WR','Z',16,-1)]),
 'Pistol':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-4),P('RB','RB','R',0,-7),P('X','WR','X',-17,-1),P('H','WR','H',-10,-1.6),P('Y','TE','Y',6.6,-1),P('Z','WR','Z',16,-1)]),
 'Empty':()=>withDefaults([...OLine(),P('QB','QB','Q',0,-5),P('X','WR','X',-19,-1),P('H','WR','H',-12.5,-1.6),P('RB','RB','R',-6.5,-1.6),P('Y','WR','Y',12.5,-1.6),P('Z','WR','Z',19,-1)]),
};
// route shapes, o = +1 toward the right sideline for a player on the right side
const ROUTES={
 Go:o=>({pts:[[o*0.5,8],[o*1,30]]}),
 Fade:o=>({pts:[[o*1,5],[o*3,30]]}),
 Seam:o=>({pts:[[-o*0.5,6],[-o*1.5,30]]}),
 Slant:o=>({pts:[[0,2],[-o*10,10],[-o*20,15]]}),
 Hitch:o=>({pts:[[0,6],[0,5]],stop:true}),
 Out:o=>({pts:[[0,9],[o*14,8.5]]}),
 In:o=>({pts:[[0,11],[-o*20,11.5]]}),
 Curl:o=>({pts:[[0,11],[-o*1,9.5]],stop:true}),
 Comeback:o=>({pts:[[0,15],[o*2.5,12.5]],stop:true}),
 Post:o=>({pts:[[0,10],[-o*9,24],[-o*12,30]]}),
 Corner:o=>({pts:[[0,10],[o*9,22],[o*11,26]]}),
 Drag:o=>({pts:[[-o*1.5,2],[-o*24,3.5]]}),
 Flat:o=>({pts:[[o*3,1.5],[o*10,3],[o*11,4]],stop:true}),
 Wheel:o=>({pts:[[o*5,0.5],[o*9,4],[o*9,30]]}),
 Swing:o=>({pts:[[o*4,-0.5],[o*9,1],[o*11,4]]}),
};
const ROUTE_LIST=Object.keys(ROUTES);
const CARRY_LIST=['Dive','Off-Tackle','Sweep','Counter'];
function outSign(p){return p.x>0.25?1:p.x<-0.25?-1:1;}
function applyRoute(p,name){const r=ROUTES[name](outSign(p));p.role='route';p.route={pts:r.pts.map(a=>a.slice()),stop:!!r.stop,name};}
function carryPts(kind,side,p){
 let A;
 if(kind==='Dive')A=[[side*1.1,-1.2],[side*1.1,4],[side*1.5,14]];
 else if(kind==='Off-Tackle')A=[[side*3,-2.8],[side*5.5,-0.8],[side*6,6],[side*6.5,14]];
 else if(kind==='Sweep')A=[[side*6,-4],[side*11,-2.5],[side*13.5,3],[side*14,14]];
 else if(kind==='Counter')A=[[p.x-side*1.8,p.y+0.6],[side*1,-2.5],[side*3.3,-0.8],[side*3.8,6],[side*4,14]];
 else A=[[side*0.3,2],[side*0.3,8]]; // sneak
 return A.map(([x,y])=>[+(x-p.x).toFixed(2),+(y-p.y).toFixed(2)]);
}
function clearBall(play,except){for(const q of play.players){if(q===except)continue;if(q.role==='carry'||q.role==='fake'){if(q.pos==='QB'){q.role='pass';q.route=null;}else{q.role='block';q.route=null;}}}}
function setCarrier(play,p,kind,side){clearBall(play,p);p.role='carry';p.read=0;p.route={pts:carryPts(kind,side,p),stop:false,name:kind+(kind==='Sneak'?'':side<0?' Left':' Right')};}
function setFake(play,p,side){clearBall(play,p);p.role='fake';p.read=0;p.route={pts:carryPts('Dive',side,p).slice(0,2),stop:false,name:'PA fake '+(side<0?'Left':'Right')};}
function isRunPlay(play){return play.players.some(p=>p.role==='carry');}
function holeXRel(players){const c=players.find(p=>p.role==='carry');if(!c||!c.route)return 0;let x=c.x;for(const [dx,dy] of c.route.pts){x=c.x+dx;if(c.y+dy>=-1.5)return x;}return x;}
function pullRel(p,players){const s=p.role==='pullL'?-1:1;const hx=holeXRel(players);return [[p.x+s*0.6,-2.2],[hx-s*1.0,-1.8],[hx,1.2]];}
function dropRel(q,drop){const gun=q.y<-3;if(drop==='rollL'||drop==='rollR'){const s=drop==='rollL'?-1:1;return [[q.x+s*2.5,Math.min(q.y,-4.5)-1.5],[q.x+s*8,-6.5],[q.x+s*10,-6]];}
 const dep=(gun?{gun:0.6,'3':1.2,'5':2.4,'7':3.6}:{gun:2.5,'3':3.5,'5':6,'7':8})[drop]||2.4;return [[q.x,q.y-dep]];}
function mirrorPlay(play){for(const p of play.players){p.x=-p.x;if(p.route)p.route.pts.forEach(a=>a[0]=-a[0]);if(p.role==='pullL')p.role='pullR';else if(p.role==='pullR')p.role='pullL';}
 if(play.qb.drop==='rollL')play.qb.drop='rollR';else if(play.qb.drop==='rollR')play.qb.drop='rollL';}

function R(p,n){applyRoute(p,n);} function BL(...ps){ps.forEach(p=>{p.role='block';p.route=null;p.read=0;});}
function reads(b,...ids){ids.forEach((id,i)=>b[id].read=i+1);}
const PRESETS=[
 {name:'Four Verticals',form:'Gun Spread',kind:'pass',f:(b,q)=>{R(b.X,'Fade');R(b.H,'Seam');R(b.Y,'Seam');R(b.Z,'Fade');BL(b.RB);q.drop='5';reads(b,'H','Y','X','Z');}},
 {name:'Mesh',form:'Gun Spread',kind:'pass',f:(b,q)=>{R(b.H,'Drag');R(b.Y,'Drag');b.Y.route.pts=[[-1.5,2.5],[-24,5.5]];R(b.X,'In');R(b.Z,'Corner');R(b.RB,'Swing');q.drop='3';reads(b,'H','Y','RB','Z','X');}},
 {name:'Slant-Flat',form:'Gun Trips',kind:'pass',f:(b,q)=>{R(b.Z,'Slant');R(b.H,'Flat');R(b.Y,'Seam');R(b.X,'Slant');BL(b.RB);q.drop='gun';reads(b,'Z','H','X','Y');}},
 {name:'Smash',form:'Gun Spread',kind:'pass',f:(b,q)=>{R(b.X,'Hitch');R(b.H,'Corner');R(b.Y,'Corner');R(b.Z,'Hitch');R(b.RB,'Flat');q.drop='3';reads(b,'H','X','Y','Z','RB');}},
 {name:'Curl-Flat',form:'Pistol',kind:'pass',f:(b,q)=>{R(b.X,'Curl');R(b.H,'Flat');R(b.Z,'Curl');R(b.Y,'Flat');BL(b.RB);q.drop='5';reads(b,'X','H','Z','Y');}},
 {name:'Deep Post',form:'Singleback',kind:'pass',f:(b,q)=>{R(b.Z,'Post');R(b.X,'Go');R(b.H,'In');R(b.Y,'Curl');BL(b.RB);q.drop='7';reads(b,'Z','H','Y','X');}},
 {name:'PA Boot',form:'Singleback',kind:'pass',f:(b,q,pl)=>{setFake(pl,b.RB,-1);q.drop='rollR';R(b.H,'Drag');R(b.Y,'Flat');R(b.Z,'Corner');R(b.X,'Post');reads(b,'Y','H','Z','X');}},
 {name:'Empty Quick',form:'Empty',kind:'pass',f:(b,q)=>{R(b.X,'Slant');R(b.H,'Hitch');R(b.RB,'Out');R(b.Y,'Hitch');R(b.Z,'Slant');q.drop='gun';reads(b,'H','Y','RB','X','Z');}},
 {name:'HB Dive',form:'I-Form',kind:'run',f:(b,q,pl)=>{setCarrier(pl,b.RB,'Dive',1);BL(b.FB,b.Y,b.X,b.Z);}},
 {name:'Power O',form:'I-Form',kind:'run',f:(b,q,pl)=>{setCarrier(pl,b.RB,'Off-Tackle',1);b.LG.role='pullR';BL(b.FB,b.Y,b.X,b.Z);}},
 {name:'Toss Sweep',form:'Singleback',kind:'run',f:(b,q,pl)=>{setCarrier(pl,b.RB,'Sweep',1);b.RG.role='pullR';BL(b.Y,b.Z,b.H,b.X);}},
 {name:'Counter',form:'Pistol',kind:'run',f:(b,q,pl)=>{setCarrier(pl,b.RB,'Counter',1);b.LG.role='pullR';BL(b.Y,b.X,b.Z,b.H);}},
 {name:'QB Sneak',form:'I-Form',kind:'run',f:(b,q,pl)=>{setCarrier(pl,b.QB,'Sneak',1);BL(b.FB,b.RB,b.Y,b.X,b.Z);}},
];
function buildPreset(pr){const players=FORMS[pr.form]();const b={};players.forEach(p=>b[p.id]=p);const pl={name:pr.name,form:pr.form,players,qb:{drop:'5'}};pr.f(b,pl.qb,pl);return pl;}

// ---------- defense ----------
const COVNAME={c0:'Cover 0',c1:'Cover 1',c2:'Cover 2',c2m:'2-Man',c3:'Cover 3',c4:'Cover 4'};
const COVDESC={c0:'All-out man, no safety help — everyone else blitzes.',c1:'Man-to-man with one deep safety in the middle.',c2:'Zone: two deep safeties split the field, corners sit in the flats.',c2m:'Man underneath with two deep safeties over the top.',c3:'Zone: three deep (corners + free safety), four underneath.',c4:'Zone: four deep quarters, three underneath. Stops deep shots.'};
const BLZNAME={none:'No blitz',lb:'LB blitz',db:'DB blitz',heavy:'Heavy blitz'};
const PKGS=['4-3','3-4','Nickel','Dime'];
function manMatch(rec,defs){
 const pairs=new Map(), avail=[...defs];
 const order=[...rec].sort((a,b)=>Math.abs(b.x)-Math.abs(a.x));
 for(const r of order){
  if(!avail.length)break;
  const ax=Math.abs(r.x), cat=ax>11?'wide':(ax>3.5&&r.y>-3)?'slot':'back';
  const pref=cat==='wide'?['CB','NB','S','LB']:cat==='slot'?['NB','S','CB','LB']:['LB','S','NB','CB'];
  let best=null,bs=1e9;
  for(const d of avail){let rk=pref.indexOf(d.pos);if(rk<0)rk=5;const s=rk*6+Math.abs(d.x-r.x)*0.5;if(s<bs){bs=s;best=d;}}
  pairs.set(best.id,r);avail.splice(avail.indexOf(best),1);
 }
 return pairs;
}
function bestAssign(defs,zones){ // choose zones.length defenders and order minimizing total distance
 const n=zones.length;let best=null,bc=1e9;const used=new Array(defs.length).fill(false),cur=[];
 (function rec(k,c){if(c>=bc)return;if(k===n){bc=c;best=cur.slice();return;}
  for(let i=0;i<defs.length;i++){if(used[i])continue;used[i]=true;cur.push(i);rec(k+1,c+hyp(defs[i].x-zones[k][0],defs[i].y-zones[k][1]));cur.pop();used[i]=false;}})(0,0);
 return best||[];
}
function buildDefense(off,call){
 const rec=off.filter(p=>ELIG[p.pos]);
 const line=rec.filter(r=>r.y>-3.2);
 const L=line.filter(r=>r.x<-0.5).sort((a,b)=>a.x-b.x), Rr=line.filter(r=>r.x>0.5).sort((a,b)=>b.x-a.x);
 const teL=line.some(r=>r.pos==='TE'&&r.x<0&&r.x>-8.6), teR=line.some(r=>r.pos==='TE'&&r.x>0&&r.x<8.6);

 else if(end==='bar'){const ang=Math.atan2(Y(b[1])-Y(a[1]),X(b[0])-X(a[0]))+Math.PI/2;ctx.beginPath();ctx.moveTo(X(b[0])+Math.cos(ang)*6,Y(b[1])+Math.sin(ang)*6);ctx.lineTo(X(b[0])-Math.cos(ang)*6,Y(b[1])-Math.sin(ang)*6);ctx.stroke();}
 else if(end==='dot'){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(b[0]),Y(b[1]),4,0,7);ctx.fill();}
 ctx.restore();}
function blockT(x,y,run){const sx=X(x),sy=Y(y);ctx.save();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();
 const L=run?PR+9:PR+5;ctx.moveTo(sx,sy-PR);ctx.lineTo(sx,sy-L);ctx.moveTo(sx-5,sy-L);ctx.lineTo(sx+5,sy-L);ctx.stroke();ctx.restore();}

function drawEditor(){
 cam.b=editCamB();drawField();drawLines();const los=G.ballOn,run=isRunPlay(play);
 for(const p of play.players){const sx=CX+p.x,sy=los+p.y;
  if(p.route&&(p.role==='route'||p.role==='carry'||p.role==='fake')){const pts=[[sx,sy],...p.route.pts.map(([dx,dy])=>[clamp(sx+dx,0.6,FW-0.6),Math.min(sy+dy,109.5)])];
   const col=p.role==='carry'?'#fb923c':p.role==='fake'?'rgba(255,255,255,.7)':(ui.sel===p?'#fde047':'#facc15');
   polyline(pts,col,ui.sel===p?3.2:2.4,p.role==='fake'?[5,5]:null,p.role==='route'?(p.route.stop?'bar':'arrow'):p.role==='carry'?'arrow':'dot');}
  else if(p.role==='pullL'||p.role==='pullR'){const pts=[[sx,sy],...pullRel(p,play.players).map(([x,y])=>[CX+x,los+y])];polyline(pts,'rgba(255,255,255,.8)',2,[4,4],run?'bar':'dot');}
  else if(p.role==='block')blockT(sx,sy,run);
  else if(p.pos==='QB'&&p.role==='pass'){const pts=[[sx,sy],...dropRel(p,play.qb.drop).map(([x,y])=>[CX+x,los+y])];
   if(run)continue;polyline(pts,'rgba(191,219,254,.9)',2,[3,4],'dot');}
 }
 for(const d of ui.defAlign)tok(CX+d.x,los+d.y,'D',d.label);
 for(const p of play.players)tok(CX+p.x,los+p.y,'O',p.label,{glow:ui.sel===p?'rgba(250,204,21,.45)':null});
 for(const p of play.players){if(p.read&&p.role==='route'&&!run){const sx=X(CX+p.x)+PR*0.95,sy=Y(los+p.y)-PR*0.95;ctx.beginPath();ctx.arc(sx,sy,7,0,7);ctx.fillStyle='#facc15';ctx.fill();
   ctx.fillStyle='#111';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.read,sx,sy+0.5);}}
 const s=ui.sel;
 if(s&&s.route&&(s.role==='route'||s.role==='carry'||s.role==='fake')){for(const [dx,dy] of s.route.pts){const hx=X(clamp(CX+s.x+dx,0.6,FW-0.6)),hy=Y(Math.min(los+s.y+dy,109.5));
  ctx.beginPath();ctx.arc(hx,hy,6.5,0,7);ctx.fillStyle='rgba(15,23,42,.85)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fde047';ctx.stroke();}}
 pill(s?(canDraw(s)?'Tap the field to add route points · drag points to adjust':'Pick an assignment below'):'Drag players to move · tap one to give him a job');
 ball(CX,los-0.4,0);
}
function ball(x,y,h){const sx=X(x),sy=Y(y);const s=1+h*0.22;if(h>0.05){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx,sy,5,2.5,0,0,7);ctx.fill();}
 ctx.save();ctx.translate(sx,sy-h*SC*0.6);ctx.fillStyle='#8b4513';ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,3.4*s,5.4*s,0.3,0,7);ctx.fill();
 ctx.beginPath();ctx.moveTo(-1.5*s,-1.5*s);ctx.lineTo(1.5*s,1.5*s);ctx.stroke();ctx.restore();}
function pill(txt){if(!txt)return;ctx.save();ctx.font='600 12px system-ui,sans-serif';const w=ctx.measureText(txt).width+20;const x=(CW-w)/2;
 ctx.fillStyle='rgba(8,13,26,.78)';roundRect(x,8,w,24,12);ctx.fill();ctx.fillStyle='#e7edfb';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,CW/2,20.5);ctx.restore();}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bigText(txt,col){ctx.save();ctx.font=`700 ${Math.min(46,CW*0.11)}px "Avenir Next Condensed","Arial Narrow",Oswald,Impact,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(txt,CW/2,CH*0.38);ctx.fillStyle=col;ctx.fillText(txt,CW/2,CH*0.38);ctx.restore();}

function followCam(bx,by){const vis=CH/SC;let tb=clamp(editCamB(),by-vis*0.62,by-vis*0.2);tb=Math.min(tb,112-vis);cam.b+=(tb-cam.b)*0.1;}
function drawSim(sim,fr){
 const f=fr||sim.frames[sim.frames.length-1];if(!f){drawEditor();return;}
 followCam(f.bx,f.by,false);drawField();drawLines();
 const E=sim.ents,pos=i=>[f.p[i*2],f.p[i*2+1]];
 ctx.globalAlpha=0.22;for(const e of sim.O){if(e.path&&(e.role==='route'||e.role==='carry'))polyline([[e.sx,e.sy],...e.path.map(p=>[p.x,p.y])],'#facc15',2,null,null);}ctx.globalAlpha=1;
 if(!fr){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;for(const b of sim.O)if(b.eng){ctx.beginPath();ctx.moveTo(X(b.x),Y(b.y));ctx.lineTo(X(b.eng.x),Y(b.eng.y));ctx.stroke();}}
 const live=!fr&&ui.mode==='play';const showOpen=live&&sim.canThrow();
 E.forEach((e,i)=>{const [x,y]=pos(i);let ring=null;
  if(i===f.hi&&!(live&&sim.canThrow()))ring='#fb923c';
  else if(showOpen&&e.team==='O'&&e.role==='route'){let m=99;for(const d of sim.Dd){const k=hyp(d.x-e.x,d.y-e.y);if(k<m)m=k;}ring=m>3?'#22c55e':m>1.6?'#eab308':'#ef4444';}
  tok(x,y,e.team,e.label,{ring});});
 ball(f.bx,f.by,f.bh);
 if(live){if(sim.flash&&sim.t-sim.flash.t<1.1)pill(sim.flash.txt);
  else pill(sim.canThrow()?'Tap a receiver to throw · hold & drag to scramble':(sim.holder&&sim.holder.team==='O'&&!sim.over)?'Hold & drag to steer the ball carrier':'');}
 if(fr)pill('REPLAY · tap to stop');
 if(ui.mode==='result'&&sim.result){const r=sim.result;const col=r.td?'#facc15':(r.int||r.kind==='sack'||r.yards<0)?'#f87171':r.inc?'#e5e7eb':'#4ade80';bigText(r.big,col);}
}

// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
 if(ui.mode==='play'&&ui.sim){const sim=ui.sim;
  if(ui.ptr&&!ui.ptr.edit&&(ui.ptr.moved||ts-ui.ptr.t0>180))ui.ptr.steering=true;
  sim.steerPt=(ui.ptr&&ui.ptr.steering&&sim.holder&&sim.holder.team==='O')?toField(ui.ptr.sx,ui.ptr.sy):null;
  acc+=dt*ui.speed;let n=0;while(acc>=1/60&&n<6){sim.step();acc-=1/60;n++;if(sim.finished)break;}
  if(sim.finished)endPlay();}
 if(ui.mode==='replay'){const rp=ui.replay;rp.i+=dt*60*ui.speed;if(rp.i>=ui.sim.frames.length-1){ui.mode='result';renderPanel();}}
 if(CW>0){ctx.setTransform(DPR,0,0,DPR,0,0);
  if(ui.mode==='edit')drawEditor();else if(ui.mode==='replay')drawSim(ui.sim,ui.sim.frames[Math.floor(ui.replay.i)]);else drawSim(ui.sim);}
 requestAnimationFrame(loop);}

// ---------- game flow ----------
function snap(){ui.sel=null;ui.sim=new Sim(clone(play),G.call,{ballOn:G.ballOn,diff:G.diff,qbMode:G.qbMode});ui.mode='play';acc=0;cam.b=editCamB();renderPanel();}
function endPlay(){ui.mode='result';renderPanel();}
function spotName(y){y=Math.round(y);return y===50?'the 50':y<50?'OWN '+y:'OPP '+(100-y);}
function ord(n){return ['1st','2nd','3rd','4th'][n-1]||n+'th';}
function ddStr(){return `${ord(G.down)} & ${G.ballOn+G.dist>=100?'Goal':G.dist}`;}
function outcome(r){ // compute next state without applying
 const s={ballOn:G.ballOn,down:G.down,dist:G.dist,tag:'',newDrive:false};
 if(r.td){s.tag='TOUCHDOWN';s.newDrive=true;return s;}
 if(r.int){s.tag='Turnover';s.newDrive=true;return s;}
 if(r.safety){s.tag='SAFETY';s.newDrive=true;return s;}
 const gained=r.inc?0:Math.round(r.yards);const spot=clamp(G.ballOn+gained,1,99);
 if(spot-G.ballOn>=G.dist&&!r.inc){s.down=1;s.ballOn=spot;s.dist=Math.min(10,100-spot);s.tag='FIRST DOWN';}
 else{s.down=G.down+1;s.ballOn=spot;s.dist=G.dist-(spot-G.ballOn);if(s.down>4){s.tag='Turnover on downs';s.newDrive=true;}}
 return s;}
function nextPlay(){const r=ui.sim.result,o=outcome(r);
 G.plays++;if(!r.inc&&!r.int)G.yards+=r.td?100-G.ballOn:r.yards;
 G.log.push({h:`${ddStr()} at ${spotName(G.ballOn)} · ${play.name} vs ${callName(G.call)}`,t:r.text+(o.tag?' — '+o.tag:'')});
 if(r.td)G.tds++;
 if(o.newDrive){G.drives++;G.log.push({drive:true,t:`Drive ${G.drives} — ${o.tag==='TOUCHDOWN'?'after the score':o.tag.toLowerCase()}`});G.ballOn=25;G.down=1;G.dist=10;}
 else{G.ballOn=o.ballOn;G.down=o.down;G.dist=o.dist;}
 if(G.log.length>150)G.log.splice(0,G.log.length-150);
 persist();ui.mode='edit';newCall();renderPanel();renderHeader();if(o.tag)toast(o.tag);}
function runItBack(){ui.mode='edit';renderPanel();}
function renderHeader(){$('#dd').textContent=ddStr();$('#spot').textContent='Ball on '+spotName(G.ballOn);
 $('#stats').innerHTML=`<b>${G.tds}</b> TD · Drive ${G.drives}<br>${G.plays} plays · ${G.yards} yds`;}

// ---------- panel ----------
function chip(act,v,label,on,cls=''){return `<button class="chip ${on?'on':''} ${cls}" data-act="${act}" data-v="${esc(v)}">${label}</button>`;}
function defLabel(){return G.defMode==='auto'?`Def: ${G.call.pkg} <small style="color:var(--mut)">(AI)</small>`:`Def: ${G.call.pkg} ${COVNAME[G.call.cov]}`;}
function renderPanel(){const P=$('#panel');
 if(ui.mode==='edit'){
  if(ui.sel){P.innerHTML=selHTML(ui.sel);return;}
  P.innerHTML=`<div class="row"><button class="pbbtn" data-act="pb">📋 <b>${esc(play.name)}</b> ▾</button><button data-act="def">🛡 ${defLabel()} ▾</button></div>
  <div class="row">${chip('qb','',G.qbMode==='user'?'🎯 You throw':'🤖 AI QB',false)}${chip('spd','',ui.speed===1?'Speed 1×':'Slow-mo ½×',ui.speed!==1)}<span class="grow"></span><button class="snap" data-act="snap">SNAP ▶</button></div>
  <div class="tip">${isRunPlay(play)?'Run play: the QB hands off automatically. Hold &amp; drag on the field during the play to steer the runner.':'Numbered badges are the QB’s read order. During the play, tap a receiver to throw — green rings mean open.'}</div>`;
 }else if(ui.mode==='play'){
  P.innerHTML=`<div class="row"><div class="mut grow">${ui.sim.passPlay?'Tap a receiver to throw. Hold &amp; drag to scramble or steer after the catch.':'Hold &amp; drag on the field to steer the ball carrier.'}</div>
  ${ui.sim.passPlay?'<button data-act="away">Throw away</button>':''}${chip('spd','',ui.speed===1?'1×':'½×',ui.speed!==1)}</div>`;
 }else if(ui.mode==='result'){const r=ui.sim.result,o=outcome(r);
  const cls=r.td?'td':(r.int||r.kind==='sack'||r.yards<0||o.tag==='Turnover on downs')?'bad':r.inc?'':'good';
  const line=r.td?'TOUCHDOWN! 🏈':r.int?'INTERCEPTED':r.inc?'Incomplete':(r.yards>=0?'+':'')+r.yards+' yards';
  P.innerHTML=`<div class="res ${cls}">${line}${o.tag&&!r.td&&!r.int?' · '+o.tag:''}</div><div class="sub">${esc(r.text)}</div><div class="sub2">Defense called: ${esc(callName(ui.sim.call))}</div>
  <div class="row" style="margin-top:9px"><button data-act="replay">⟲ Replay</button><button data-act="again">↺ Run it back</button><span class="grow"></span><button class="snap" data-act="next">Next ▶</button></div>`;
 }else if(ui.mode==='replay'){P.innerHTML=`<div class="row"><div class="mut grow">Replaying the play…</div>${chip('spd','',ui.speed===1?'1×':'½×',ui.speed!==1)}<button data-act="stopreplay">Stop</button></div>`;}
}
function canDraw(p){return p.role==='route'||p.role==='carry'||p.role==='fake'||ELIG[p.pos];}
function selHTML(p){const run=isRunPlay(play);let h=`<div class="selhead"><div class="badge">${esc(p.label)}</div><div class="what"><b>${esc(p.id)}</b> · ${POSNAME[p.pos]}<small>${roleText(p)}</small></div><button data-act="done">Done</button></div>`;
 if(p.pos==='OL'){h+=`<div class="grp"><label>Assignment</label><div class="chips">${chip('block','','Block',p.role==='block')}${chip('pull','L','Pull left',p.role==='pullL')}${chip('pull','R','Pull right',p.role==='pullR')}</div>
  <div class="desc">Pass plays: pass protection. Run plays: drive-block the nearest defender. Pulls only happen on run plays — the lineman runs behind the line to lead through the hole.</div></div>`;}
 else if(p.pos==='QB'){h+=`<div class="grp"><label>Dropback</label><div class="chips">${[['gun','Quick set'],['3','3-step'],['5','5-step'],['7','7-step'],['rollL','Rollout ◀'],['rollR','Rollout ▶']].map(([v,l])=>chip('drop',v,l,p.role!=='carry'&&play.qb.drop===v)).join('')}</div>
  ${run&&p.role!=='carry'?'<div class="desc">This is a run play, so the QB hands off. Give a back a pass route or Block to make it a pass play.</div>':''}</div>
  <div class="grp"><label>QB run</label><div class="chips">${chip('carry','Sneak:1','QB sneak',p.role==='carry'&&p.route&&p.route.name==='Sneak')}${chip('qbpath','','✏️ Draw QB run path',p.role==='carry'&&p.route&&p.route.name==='Custom')}</div></div>`;}
 else{const isR=p.role==='route';
  h+=`<div class="grp"><label>Route</label><div class="chips">${ROUTE_LIST.map(n=>chip('route',n,n,isR&&p.route&&p.route.name===n)).join('')}</div></div>
  <div class="grp"><div class="chips">${chip('newpath','','✏️ Draw new path',false)}${chip('undo','','↶ Undo point',false)}${chip('flip','','⇋ Mirror',false)}${isR?chip('stop','',p.route&&p.route.stop?'■ Stops at end':'➜ Keeps running',false):''}</div></div>`;
  if(isR)h+=`<div class="grp"><label>QB read order</label><div class="chips">${[1,2,3,4,5].map(n=>chip('read',n,String(n),p.read===n)).join('')}${chip('read',0,'None',!p.read)}</div></div>`;
  h+=`<div class="grp"><label>Other jobs</label><div class="chips">${chip('block','','Block',p.role==='block')}</div></div>`;
  if(p.pos==='RB'||p.pos==='FB'||p.pos==='TE'||p.pos==='WR'){
   h+=`<div class="grp"><label>Ball carrier (makes it a run play)</label><div class="chips">${CARRY_LIST.map(k=>chip('carry',k+':-1',k+' ◀',p.role==='carry'&&p.route&&p.route.name===k+' Left')+chip('carry',k+':1',k+' ▶',p.role==='carry'&&p.route&&p.route.name===k+' Right')).join('')}</div></div>
   <div class="grp"><label>Play-action fake</label><div class="chips">${chip('fake','-1','Fake ◀',p.role==='fake'&&p.route&&p.route.name==='PA fake Left')}${chip('fake','1','Fake ▶',p.role==='fake'&&p.route&&p.route.name==='PA fake Right')}</div></div>`;}
 }
 return h;}
function roleText(p){if(p.role==='route')return 'Route: '+(p.route?p.route.name:'—')+(p.read?' · read #'+p.read:'');if(p.role==='carry')return 'Ball carrier: '+(p.route?p.route.name:'');
 if(p.role==='fake')return 'Play-action fake, then pass protect';if(p.role==='pullL')return 'Pull left';if(p.role==='pullR')return 'Pull right';
 if(p.pos==='QB')return 'Dropback: '+({gun:'quick set','3':'3-step','5':'5-step','7':'7-step',rollL:'rollout left',rollR:'rollout right'}[play.qb.drop]);return 'Block';}

function decodePlay(s){const p=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));if(!p||!Array.isArray(p.players)||p.players.length!==11||!p.qb)throw 0;return p;}

// ---------- actions ----------
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),1600);}
function changed(){refreshDef();renderPanel();}
function loadPlay(p){play=p;ui.sel=null;if(G.defMode==='auto')newCall();else refreshDef();closeSheet();renderPanel();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,s=ui.sel;
 switch(a){
 case 'snap':snap();break;
 case 'pb':openSheet(sheetPlaybook());break;
 case 'def':openSheet(sheetDefense());break;
 case 'log':openSheet(sheetLog());break;
 case 'help':openSheet(sheetHelp());break;
 case 'close':closeSheet();break;
 case 'qb':G.qbMode=G.qbMode==='user'?'ai':'user';persist();renderPanel();toast(G.qbMode==='user'?'You pick the throw':'AI QB reads the progression');break;
 case 'spd':ui.speed=ui.speed===1?0.5:1;renderPanel();break;
 case 'done':ui.sel=null;renderPanel();break;
 case 'route':applyRoute(s,v);if(!play.players.some(p=>p.role==='carry'))play.players.find(p=>p.pos==='QB').role='pass';changed();break;
 case 'newpath':if(s.role!=='carry'&&s.role!=='fake')s.role='route';s.route={pts:[],stop:false,name:'Custom'};changed();toast('Tap the field to place points');break;
 case 'undo':if(s.route&&s.route.pts.length){s.route.pts.pop();s.route.name='Custom';changed();}break;
 case 'flip':if(s.route){s.route.pts.forEach(q=>q[0]=-q[0]);s.route.name+=s.route.name.endsWith('(flipped)')?'':' (flipped)';changed();}break;
 case 'stop':if(s.route){s.route.stop=!s.route.stop;changed();}break;
 case 'read':{const n=+v;if(n){const o=play.players.find(p=>p!==s&&p.read===n);if(o)o.read=s.read||0;}s.read=n;changed();break;}
 case 'block':s.role='block';s.route=null;s.read=0;if(!play.players.some(p=>p.role==='carry'))play.players.find(p=>p.pos==='QB').role='pass';changed();break;
 case 'pull':s.role=v==='L'?'pullL':'pullR';changed();if(!isRunPlay(play))toast('Pulls only happen on run plays');break;
 case 'carry':{const [k,sd]=v.split(':');setCarrier(play,s,k,+sd);changed();break;}
 case 'qbpath':clearBall(play,s);s.role='carry';s.route={pts:[],stop:false,name:'Custom'};changed();toast('Tap the field to draw the QB’s path');break;
 case 'fake':setFake(play,s,+v);changed();break;
 case 'drop':play.qb.drop=v;if(s.role==='carry'){s.role='pass';s.route=null;}changed();break;
 case 'load':loadPlay(buildPreset(PRESETS[+v]));toast(PRESETS[+v].name+' loaded');break;
 case 'loadmy':loadPlay(clone(myPlays()[+v]));break;
 case 'delmy':{const m=myPlays();m.splice(+v,1);lsSet('plays',m);openSheet(sheetPlaybook());break;}
 case 'blank':loadPlay({name:v+' (custom)',form:v,players:FORMS[v](),qb:{drop:'5'}});break;
 case 'mirror':mirrorPlay(play);refreshDef();closeSheet();renderPanel();toast('Play flipped');break;
 case 'saveui':$('#sheetExtra').innerHTML=`<input type="text" id="saveName" value="${esc(play.name)}" maxlength="40"><div class="row" style="margin-top:8px"><button class="snap" style="font-size:15px;padding:9px 16px" data-act="dosave">Save play</button></div>`;break;
 case 'dosave':{const n=($('#saveName').value||'My play').trim();const p=clone(play);p.name=n;play.name=n;const m=myPlays().filter(q=>q.name!==n);m.push(p);lsSet('plays',m);openSheet(sheetPlaybook());renderPanel();toast('Saved “'+n+'”');break;}
 case 'copy':{const code=encodePlay(play);const fb=()=>{$('#sheetExtra').innerHTML=`<div class="desc">Copy this code:</div><textarea readonly>${code}</textarea>`;const t=$('#sheetExtra textarea');t.focus();t.select();};
  try{navigator.clipboard.writeText(code).then(()=>toast('Play code copied'),fb);}catch(_){fb();}break;}
 case 'importui':$('#sheetExtra').innerHTML=`<textarea id="impCode" placeholder="Paste a play code"></textarea><div class="row" style="margin-top:8px"><button data-act="doimport">Load play</button></div>`;break;
 case 'doimport':try{loadPlay(decodePlay($('#impCode').value));toast('Play imported');}catch(_){toast('That code didn’t work');}break;
 case 'defmode':G.defMode=v;persist();newCall();openSheet(sheetDefense());renderPanel();break;
 case 'pkg':G.manual.pkg=v;persist();newCall();openSheet(sheetDefense());renderPanel();break;
 case 'cov':G.manual.cov=v;if(v==='c0')G.manual.blitz='heavy';persist();newCall();openSheet(sheetDefense());renderPanel();break;
 case 'blz':G.manual.blitz=v;persist();newCall();openSheet(sheetDefense());renderPanel();break;
 case 'diff':G.diff=v;persist();openSheet(sheetDefense());break;
 case 'reroll':newCall();renderPanel();closeSheet();toast('New look: '+G.call.pkg);break;
 case 'newdrive':G.drives++;G.ballOn=25;G.down=1;G.dist=10;G.log.push({drive:true,t:'Drive '+G.drives+' — fresh start'});persist();newCall();renderHeader();closeSheet();renderPanel();break;
 case 'reset':Object.assign(G,{ballOn:25,down:1,dist:10,tds:0,drives:1,plays:0,yards:0,log:[]});persist();newCall();renderHeader();closeSheet();renderPanel();break;
 case 'away':ui.sim.throwAway();break;
 case 'replay':ui.mode='replay';ui.replay={i:0};cam.b=editCamB();renderPanel();break;
 case 'stopreplay':ui.mode='result';renderPanel();break;
 case 'again':runItBack();break;
 case 'next':nextPlay();break;
 }});

// ---------- pointer ----------
function ptrPos(e){const r=cv.getBoundingClientRect();return {sx:e.clientX-r.left,sy:e.clientY-r.top};}
function hitPlayer(sx,sy){let best=null,bd=PR+12;for(const p of play.players){const d=hyp(X(CX+p.x)-sx,Y(G.ballOn+p.y)-sy);if(d<bd){bd=d;best=p;}}return best;}
function hitHandle(sx,sy){const p=ui.sel;if(!p||!p.route)return -1;let bi=-1,bd=17;p.route.pts.forEach(([dx,dy],i)=>{const d=hyp(X(clamp(CX+p.x+dx,0.6,FW-0.6))-sx,Y(Math.min(G.ballOn+p.y+dy,109.5))-sy);if(d<bd){bd=d;bi=i;}});return bi;}
const r2=v=>Math.round(v*2)/2;
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=ptrPos(e);
 ui.ptr={x0:p.sx,y0:p.sy,sx:p.sx,sy:p.sy,t0:performance.now(),moved:false,edit:ui.mode==='edit'};
 if(ui.mode==='edit'){const hi=hitHandle(p.sx,p.sy);if(hi>=0)ui.ptr.drag={type:'pt',i:hi};else{const pl=hitPlayer(p.sx,p.sy);ui.ptr.drag=pl?{type:'player',p:pl}:{type:'empty'};}}
 else if(ui.mode==='replay'){ui.mode='result';renderPanel();ui.ptr=null;}});
cv.addEventListener('pointermove',e=>{const u=ui.ptr;if(!u)return;const p=ptrPos(e);u.sx=p.sx;u.sy=p.sy;if(hyp(p.sx-u.x0,p.sy-u.y0)>7)u.moved=true;
 if(!u.edit||!u.moved)return;const f=toField(p.sx,p.sy),d=u.drag;
 if(d.type==='pt'){const s=ui.sel;s.route.pts[d.i]=[r2(f.x-(CX+s.x)),r2(Math.min(f.y,109.5)-(G.ballOn+s.y))];s.route.name='Custom';}
 else if(d.type==='player'){const pl=d.p;pl.x=clamp(r2(f.x-CX),-25.5,25.5);pl.y=clamp(r2(f.y-G.ballOn),-12,pl.pos==='OL'?-0.8:-0.6);if(pl.pos==='OL')pl.y=Math.min(pl.y,-0.8);refreshDef();}});
function ptrEnd(e){const u=ui.ptr;ui.ptr=null;if(!u)return;
 if(u.edit&&ui.mode==='edit'){const d=u.drag;
  if(!u.moved){
   if(d.type==='player'){ui.sel=ui.sel===d.p?null:d.p;renderPanel();}
   else if(d.type==='empty'){const s=ui.sel;
    if(s&&canDraw(s)){const f=toField(u.sx,u.sy);if(!(s.route&&(s.role==='route'||s.role==='carry'||s.role==='fake'))){s.role='route';s.route={pts:[],stop:false,name:'Custom'};}
     if(s.route.pts.length>=10){toast('Max 10 points');return;}
     s.route.pts.push([r2(clamp(f.x,0.6,FW-0.6)-(CX+s.x)),r2(Math.min(f.y,109.5)-(G.ballOn+s.y))]);s.route.name='Custom';changed();}
    else if(s){ui.sel=null;renderPanel();}}}
  else if(d.type==='player'){if(ui.sel===d.p)renderPanel();}
  return;}
 if(ui.mode==='play'&&!u.steering){const sim=ui.sim;if(sim.canThrow()){let best=null,bd=40;for(const r of sim.O){if(r===sim.qb||!ELIG[r.pos])continue;const k=hyp(X(r.x)-u.sx,Y(r.y)-u.sy);if(k<bd){bd=k;best=r;}}
  if(best)sim.throwTo(best);}}}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);

// ---------- boot ----------
newCall();renderHeader();renderPanel();resize();requestAnimationFrame(loop);
if(!lsGet('seen',false)){lsSet('seen',true);openSheet(sheetHelp());}
// ---------- web app: offline + install hint ----------
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
(function(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
 if(!ios||standalone||lsGet('installTipDone',false))return;
 const d=document.createElement('div');d.id='installTip';
 d.innerHTML='<b>Install Playmaker:</b> tap <span class="share"></span> Share, then <b>Add to Home Screen</b>. It runs full-screen and works offline.<button aria-label="Dismiss">✕</button>';
 d.querySelector('button').onclick=()=>{lsSet('installTipDone',true);d.remove();};
 const show=()=>{if(document.getElementById('installTip'))return;if(!$('#sheetBg').classList.contains('hidden')){setTimeout(show,1500);return;}document.body.appendChild(d);};setTimeout(show,1500);})();
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script>
</body>
