<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dinner Decider</title>
  <meta name="description" content="What's for dinner? Picks from the places around home, based on what you've liked and how long it's been.">
  <meta name="theme-color" content="#f6f2ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dinner">
  <script>
    // Apply the saved theme before first paint (auto = follow the phone).
    (function () {
      var t = "auto";
      try { t = localStorage.getItem("takeout.theme") || "auto"; } catch (e) {}
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      var dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#16141a" : "#f6f2ea");
    })();
  </script>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons-outline.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <main id="app" aria-live="polite"><p class="loading">Warming up the kitchen…</p></main>

  <div id="tonight" hidden></div>
  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><i class="ti ti-tools-kitchen-2" aria-hidden="true"></i>Hungry</a>
    <a href="#/browse" data-tab="browse"><i class="ti ti-search" aria-hidden="true"></i>Browse</a>
    <a href="#/history" data-tab="history"><i class="ti ti-notebook" aria-hidden="true"></i>History</a>
    <a href="#/settings" data-tab="settings"><i class="ti ti-adjustments" aria-hidden="true"></i>Settings</a>
  </nav>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
